name: TestFlight

# Triggered by Claude once the ASC_KEY_P8 secret is set.
on:
  workflow_dispatch:
    inputs:
      issuer_id:
        description: "App Store Connect API Issuer ID"
        required: true

env:
  ASC_KEY_ID: 2S66TTGY5Q
  APPLE_TEAM_ID: VRPVPJAN9G

jobs:
  deploy:
    name: Build & upload to TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool/xcodebuild search these dirs for AuthKey_<id>.p8
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # The archive must be SIGNED so the Sign in with Apple entitlement is
      # embedded in the code signature — an unsigned archive re-signed at
      # export loses it and ASAuthorization fails on device (error 1000).
      # The distribution identity lives in the Cini target's build settings
      # (project.yml), not on the CLI, so it can't leak to SPM targets.
      - name: Archive (cloud-managed signing)
        env:
          ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        run: |
          xcodebuild archive \
            -project Cini.xcodeproj \
            -scheme Cini \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Cini.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.0"

      - name: Export IPA
        env:
          ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cini.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
