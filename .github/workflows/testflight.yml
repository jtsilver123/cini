name: TestFlight

# Triggered by Claude once the ASC_KEY_P8 secret is set.
on:
  workflow_dispatch:
    inputs:
      issuer_id:
        description: "App Store Connect API Issuer ID"
        required: true

env:
  ASC_KEY_ID: 2S66TTGY5Q
  APPLE_TEAM_ID: VRPVPJAN9G

jobs:
  deploy:
    name: Build & upload to TestFlight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool/xcodebuild search these dirs for AuthKey_<id>.p8
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Archive unsigned (no registered devices => no dev profiles, and a
      # manual distribution identity conflicts with automatic signing).
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Cini.xcodeproj \
            -scheme Cini \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Cini.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.${{ github.run_number }}"

      # An unsigned archive carries no entitlements, and the export re-sign
      # builds its entitlements from whatever the app already declares — so
      # Sign in with Apple / push silently vanish (that broke Apple sign-in
      # on device in build 6). Ad-hoc sign with our entitlements file first
      # so the distribution re-sign preserves them.
      - name: Stamp entitlements into the archive
        run: |
          APP="$RUNNER_TEMP/Cini.xcarchive/Products/Applications/Cini.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.dylib' -o -name '*.framework' \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - \
            --entitlements Cini/Resources/Cini.entitlements "$APP"
          echo "--- entitlements now in archive ---"
          codesign -d --entitlements :- "$APP"

      - name: Export IPA
        env:
          ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cini.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      # Fail fast if the distribution re-sign dropped the entitlements —
      # otherwise Apple sign-in breaks on device and we only find out from
      # a tester.
      - name: Verify entitlements survived export
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" | tee "$RUNNER_TEMP/final-entitlements.plist"
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/final-entitlements.plist" \
            || { echo "::error::Sign in with Apple entitlement missing from final IPA"; exit 1; }
          grep -q "aps-environment" "$RUNNER_TEMP/final-entitlements.plist" \
            || { echo "::error::aps-environment entitlement missing from final IPA"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
