name: Deploy Pages

on:
  push:
    branches: [claude/ecstatic-cori-k7s2n0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (served from the trycini.com custom domain)
        run: |
          mkdir -p _site/prototype
          # Custom apex domain — must ship in the Pages artifact.
          cp CNAME _site/CNAME
          cp prototype/index.html _site/prototype/index.html
          cp prototype/favicon.png _site/prototype/favicon.png
          # Marketing site at the root: landing + legal pages.
          cp index.html _site/index.html
          cp site.css _site/site.css
          cp favicon.png _site/favicon.png
          # High-res social/link-preview image (crisp in iMessage link previews).
          cp og.png _site/og.png
          cp privacy.html _site/privacy.html
          cp terms.html _site/terms.html
          mkdir -p _site/import
          cp import.html _site/import/index.html
          # import.html is served from /import/, so it needs its own copy.
          cp favicon.png _site/import/favicon.png
          # Admin dashboard (KPIs/trends) served from /admin/. Gated by Supabase
          # auth + is_admin() RPCs — no secrets in the page (public anon key only).
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          cp favicon.png _site/admin/favicon.png
          # Invite landing page served from /i/.
          mkdir -p _site/i
          cp i/index.html _site/i/index.html
          cp favicon.png _site/i/favicon.png
          # Shared-list page served from /l/ (renders the list via the public
          # read RPCs; falls back to an open-in-app landing if private).
          mkdir -p _site/l
          cp l/index.html _site/l/index.html
          cp favicon.png _site/l/favicon.png
          # Public profile page served from /u/?u=<username> (read-only, renders
          # a public member's rankings via the anon public_* RPCs).
          mkdir -p _site/u
          cp u/index.html _site/u/index.html
          cp favicon.png _site/u/favicon.png
          # Public title page served from /m/?id=<tmdb_id> (TMDB metadata + Cini
          # community score + who-ranked-it + notes via the anon public_* RPCs).
          mkdir -p _site/m
          cp m/index.html _site/m/index.html
          cp favicon.png _site/m/favicon.png
          # Charts / best-of (ranked by community score; filterable) — indexable.
          mkdir -p _site/charts
          cp charts/index.html _site/charts/index.html
          cp favicon.png _site/charts/favicon.png
          # Movie-night invite served from /night/?m=&t=&f= — the link the
          # "Draft a text" flow sends to friends who don't have Cini yet.
          mkdir -p _site/night
          cp night/index.html _site/night/index.html
          cp favicon.png _site/night/favicon.png
          # Public taste-match page served from /match/?a=&b=.
          mkdir -p _site/match
          cp match/index.html _site/match/index.html
          cp favicon.png _site/match/favicon.png
          # Web search (movies/TV + people) served from /search/?q=.
          mkdir -p _site/search
          cp search/index.html _site/search/index.html
          cp favicon.png _site/search/favicon.png
          # Apple App Site Association — lets iOS open invite/list links
          # (/i/*, /l/*) straight in the app via Universal Links. Served from
          # /.well-known/ with no file extension over https.
          mkdir -p _site/.well-known
          cp .well-known/apple-app-site-association _site/.well-known/apple-app-site-association
          # SEO: crawl directives + sitemap, and the programmatic review pages
          # (/reviews/*, generated by scripts/build_review_pages.py from TMDB).
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp -R reviews _site/reviews
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
