name: CI

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    name: RankingEngine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test --package-path RankingEngine

  contract-check:
    name: Supabase contract check (live queries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute every app query against production
        run: python3 scripts/contract_check.py

  ios-build:
    name: iOS app build (Xcode)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app + run app tests on simulator
        run: |
          set -o pipefail
          # Address the simulator by UDID, not name: on macos-26 a name like
          # "iPhone 17 Pro" matches two destinations (arm64 + x86_64) that share
          # one UDID, and xcodebuild can stall resolving the pair. We also boot
          # it explicitly and wait, so `xcodebuild test` never hangs on a cold
          # simulator.
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcodebuild test \
            -project Cini.xcodeproj \
            -scheme Cini \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -300

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/**
          if-no-files-found: warn

      - name: Engine tests (macOS)
        run: swift test --package-path RankingEngine
