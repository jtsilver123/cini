name: CI

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    name: RankingEngine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test --package-path RankingEngine

  ios-build:
    name: iOS app build (Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app + run app tests on simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9][^(]*" | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project Cini.xcodeproj \
            -scheme Cini \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -300

      - name: Engine tests (macOS)
        run: swift test --package-path RankingEngine
