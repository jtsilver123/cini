# XcodeGen project definition — run `xcodegen generate` to produce Cini.xcodeproj.
name: Cini
options:
  bundleIdPrefix: app.cini
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  RankingEngine:
    path: RankingEngine
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Build with the latest (iOS 27 beta) SDK so Liquid Glass paths compile;
    # the app still runs back to iOS 17 via availability checks.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  Cini:
    type: application
    platform: iOS
    sources:
      - Cini
    dependencies:
      - package: RankingEngine
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cini.ios
        INFOPLIST_FILE: Cini/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Cini/Resources/Cini.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
