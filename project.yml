# XcodeGen project definition — run `xcodegen generate` to produce Cini.xcodeproj.
name: Cini
options:
  bundleIdPrefix: app.cini
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  RankingEngine:
    path: RankingEngine
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Merge standard identity keys (CFBundleIdentifier, versions, executable)
    # into the custom Info.plist that carries our config keys.
    GENERATE_INFOPLIST_FILE: YES
    # Build with the latest (iOS 27 beta) SDK so Liquid Glass paths compile;
    # the app still runs back to iOS 17 via availability checks.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  Cini:
    type: application
    platform: iOS
    sources:
      - Cini
    configFiles:
      Debug: Cini/Resources/Secrets.xcconfig
      Release: Cini/Resources/Secrets.xcconfig
    dependencies:
      - package: RankingEngine
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cini.ios
        INFOPLIST_FILE: Cini/Resources/Info.plist
        # Must live at the TARGET level: XcodeGen writes its own per-target
        # default of "1,2" (iPhone+iPad) which overrides the project setting,
        # and an iPad-capable bundle trips ITMS-90474 (iPad multitasking
        # requires all four orientations).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Distribution identity for the TestFlight archive. Target-level so
        # SPM package targets keep their automatic signing (a CLI-wide
        # override broke them in CI round 2), and device-SDK-only so
        # simulator builds are untouched.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Cini/Resources/Cini.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    scheme:
      testTargets:
        - CiniTests

  CiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CiniTests
    dependencies:
      - target: Cini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cini.ios.tests
