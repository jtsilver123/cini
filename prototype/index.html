<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#131011">
<title>Cini — Prototype</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Limelight&display=swap" rel="stylesheet">
<style>
  :root{
    /* Movie-palace palette: marquee gold accents, velvet-red CTAs,
       warm lamp-lit charcoal room. */
    --marquee:#E8B64C; --velvet:#A8352A; --marquee-soft:rgba(232,182,76,.16);
    --ink:#F5EEDF; --bg:#131011; --surface:#1D1719; --surface-2:#281F20;
    --gray:#A69C91; --green:#2FBF71; --amber:#E0A93E; --red:#D96B6B;
    --gold:#D9A93C; --gold-soft:rgba(217,169,60,.16);
    --hair:rgba(255,255,255,.10);
    --s-loved:#53B17C; --s-fine:#F4C95C; --s-disliked:#EE9E9E;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --spring:cubic-bezier(.2,.9,.3,1);
  }

  /* Matinee: house lights up. Toggled from Menu → Appearance. */
  html[data-theme="light"] body, [data-theme="light"]{
    --marquee:#A9781E; --velvet:#9E2F25; --marquee-soft:rgba(169,120,30,.14);
    --ink:#221B14; --bg:#FAF5EA; --surface:#FFFDF6; --surface-2:#F1EADB;
    --gray:#84796B; --green:#1D8A4F; --amber:#B07F16; --red:#C24444;
    --gold:#A87B14; --gold-soft:rgba(168,123,20,.14);
    --hair:rgba(0,0,0,.12);
    --shadow:0 10px 30px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#070504;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);}
  .serif{font-family:"DM Serif Display","New York","Iowan Old Style",Georgia,serif;}

  #phone{position:relative; width:100%; max-width:430px; margin:0 auto; height:100vh; height:100dvh;
    background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 70px rgba(0,0,0,.7);}
  @media(min-width:480px){
    body{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
    #phone{height:880px; border-radius:48px; border:12px solid #000;}
  }

  .statusbar{display:flex; justify-content:space-between; align-items:center;
    padding:12px 24px 4px; font-size:14px; font-weight:700; flex:0 0 auto;}

  .screen{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:110px;}
  .pad{padding:0 18px;}
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* Tab bar */
  .cinifab{position:absolute; right:14px; bottom:102px; z-index:29; width:50px; height:50px;
    border-radius:50%; border:none; background:linear-gradient(160deg,#F0C566,#C8932F);
    color:#131011; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .cinifab svg{width:22px; height:22px; stroke:#131011; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .tabbar{position:absolute; bottom:0; left:0; right:0; height:86px; z-index:30;
    background:rgba(13,15,17,.92); backdrop-filter:blur(20px) saturate(1.3);
    border-top:1px solid var(--hair); display:flex; align-items:flex-start;
    justify-content:space-around; padding-top:9px;}
  .tab{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px;
    color:var(--gray); border:none; background:none; flex:1; cursor:pointer; font-weight:500;}
  .tab.active{color:var(--marquee); font-weight:700;}
  .tab svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .tab.center .plus{width:56px; height:56px; border-radius:50%; margin-top:-26px;
    background:linear-gradient(160deg,#F0C566,#C8932F); color:#131011; display:flex; align-items:center;
    justify-content:center; font-size:30px; font-weight:400;
    box-shadow:0 8px 20px rgba(232,182,76,.35), inset 0 1px 0 rgba(255,255,255,.4);}

  /* Pills, badges, cards */
  .pill{display:inline-flex; align-items:center; gap:7px; background:linear-gradient(160deg,#B8453A,#7E251C); color:#fff;
    border:none; border-radius:999px; padding:10px 17px; font-size:13.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; box-shadow:0 3px 10px rgba(168,53,42,.25); transition:transform .12s;}
  .pill:active{transform:scale(.95);}
  .pill.out{background:transparent; color:var(--marquee); border:1.4px solid var(--marquee); box-shadow:none;}
  .pill.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--hair); box-shadow:none;}
  .pill.ghost.on{background:var(--marquee); color:#fff; border-color:var(--marquee);}
  .row-scroll{display:flex; gap:10px; overflow-x:auto; padding:6px 18px 8px; scrollbar-width:none;}
  .row-scroll::-webkit-scrollbar{display:none;}

  .badge{width:52px; height:52px; border-radius:50%; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17.5px;
    position:relative; flex:0 0 auto; box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .badge.sm{width:44px; height:44px; font-size:15px;}
  .badge.g{border:1.8px solid rgba(31,157,85,.45); color:var(--green);}
  .badge.a{border:1.8px solid rgba(201,136,26,.45); color:var(--amber);}
  .badge.r{border:1.8px solid rgba(181,74,74,.45); color:var(--red);}
  .badge .chip{position:absolute; bottom:-3px; right:-4px; background:var(--marquee); color:#fff;
    font-size:9px; font-weight:800; padding:2.5px 6px; border-radius:999px; border:1.5px solid #fff;}
  .gtxt{color:var(--green);}

  .poster{border-radius:10px; background-size:cover; background-position:center;
    box-shadow:0 5px 14px rgba(0,0,0,.18); flex:0 0 auto; background-color:#22383a;}

  .card{background:var(--surface); border-radius:20px; padding:18px; margin:0 18px; box-shadow:var(--shadow);}
  h2.section{font-size:11.5px; letter-spacing:.08em; color:var(--gray); font-weight:700; margin:20px 18px 10px;}
  .wordmark{font-family:"Limelight",Georgia,serif; font-size:28px; color:var(--marquee); font-weight:400; letter-spacing:0;}

  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; flex:0 0 auto; background:linear-gradient(140deg,#88aab0,#5d818a); cursor:pointer;}
  .av1{background:linear-gradient(140deg,#c98ba8,#9a5677);} .av2{background:linear-gradient(140deg,#8ba8c9,#56779a);}
  .av3{background:linear-gradient(140deg,#c9b08b,#9a8156);} .av4{background:linear-gradient(140deg,#9dc98b,#6f9a56);}

  .listrow{display:flex; gap:13px; padding:15px 18px; border-bottom:1px solid var(--hair); align-items:flex-start;}
  .meta{opacity:.78; font-size:13.5px; margin-top:1px;} .sub{color:var(--gray); font-size:12px;}
  .iconbtn{background:none; border:none; font-size:19px; cursor:pointer; padding:2px; color:var(--ink); transition:transform .12s;}
  .iconbtn:active{transform:scale(1.25);}
  .spacer{flex:1;}

  .subtabs{display:flex; gap:24px; padding:12px 18px 0; overflow-x:auto; scrollbar-width:none;}
  .subtab{font-size:14.5px; color:var(--gray); padding-bottom:9px; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-left:none; border-right:none; border-top:none;}
  .subtab.active{color:var(--ink); font-weight:700; border-bottom-color:var(--gold);}

  .seg{display:flex; background:rgba(255,255,255,.07); border-radius:999px; padding:4px; margin:0 18px;}
  .seg button{flex:1; border:none; background:none; padding:9px 2px; border-radius:999px; font-size:12.5px; cursor:pointer; color:var(--ink);}
  .seg button.active{background:var(--surface-2); font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.4);}

  .searchfield{display:flex; gap:9px; align-items:center; background:var(--surface); border:1px solid var(--hair);
    border-radius:14px; padding:12px 14px; font-size:14px;}
  .searchfield input{border:none; outline:none; flex:1; font-size:14px; background:none; color:var(--ink);}

  /* Overlays */
  .overlay{position:absolute; inset:0; z-index:50; overflow-y:auto;
    background:rgba(15,22,23,.62); backdrop-filter:blur(3px);
    padding:16px 14px 40px; display:flex; flex-direction:column; gap:11px;}
  .fcard{background:var(--surface); border-radius:22px; padding:18px 20px; box-shadow:0 14px 38px rgba(10,20,20,.22);
    animation:rise .28s cubic-bezier(.2,.9,.3,1);}
  @keyframes rise{from{transform:translateY(26px); opacity:0;} to{transform:none; opacity:1;}}

  .sheet{position:absolute; left:0; right:0; bottom:0; max-height:86%; background:var(--surface); z-index:60;
    border-radius:24px 24px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25); display:flex; flex-direction:column;
    animation:slideup .25s cubic-bezier(.2,.9,.3,1);}
  @keyframes slideup{from{transform:translateY(40%); opacity:.5;} to{transform:none; opacity:1;}}
  .sheet-head{display:flex; align-items:center; padding:16px 18px 10px;}
  .sheet-body{flex:1; overflow-y:auto; padding:4px 18px 28px;}
  .grabber{width:38px; height:5px; border-radius:999px; background:rgba(255,255,255,.25); margin:8px auto 0;}
  .scrim{position:absolute; inset:0; background:rgba(15,22,23,.45); z-index:55;}

  .circles{display:flex; margin-top:16px;}
  .circ-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:11px; cursor:pointer; background:none; border:none;}
  .circ{width:64px; height:64px; border-radius:50%; transition:.2s; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:25px; font-weight:700; box-shadow:inset 0 -3px 8px rgba(0,0,0,.06);}
  .circ-opt span{font-size:13.5px; color:var(--ink); text-align:center;}
  .circ-opt.dim .circ{opacity:.4;} .circ-opt.dim span{color:var(--gray);}
  .circ-opt.sel .circ{transform:scale(1.08); box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .circ-opt.sel span{font-weight:700;}

  .vswrap{display:flex; align-items:stretch; margin:18px 0 4px; position:relative;}
  .vscard{flex:1; border:1.5px solid rgba(232,182,76,.6); border-radius:18px; min-height:166px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    cursor:pointer; padding:14px; transition:.15s; background:var(--surface-2);}
  .vscard:active{background:var(--marquee-soft); transform:scale(.97);}
  .orb{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:44px; height:44px;
    border-radius:50%; background:var(--marquee); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:13px; font-weight:900; z-index:2; box-shadow:0 3px 10px rgba(168,53,42,.4);}
  .vsctrl{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding:0 4px;}
  .lnk{color:var(--marquee); font-weight:700; font-size:14.5px; cursor:pointer; background:none; border:none; display:flex; gap:6px; align-items:center;}
  .lnk.off{color:rgba(138,143,152,.5);}
  .tough{border:1.5px solid var(--marquee); border-radius:999px; padding:10px 18px; color:var(--marquee);
    font-weight:700; font-size:14.5px; cursor:pointer; background:transparent;}

  .erow{display:flex; gap:15px; align-items:center; padding:14px 0; border-bottom:1px solid var(--hair); cursor:pointer;}
  .erow .ic{width:26px; text-align:center; font-size:17px;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 13px 41px; scrollbar-width:none; border-bottom:1px solid var(--hair);}
  .chips::-webkit-scrollbar{display:none;}
  .chip-f{background:rgba(255,255,255,.08); border:none; border-radius:11px; padding:9px 14px; font-size:13px; white-space:nowrap; cursor:pointer; color:var(--ink);}
  .chip-f.on{background:var(--marquee); color:#fff;}
  .switch{width:48px; height:29px; border-radius:999px; background:rgba(255,255,255,.18); position:relative; cursor:pointer; transition:.2s; flex:0 0 auto; border:none;}
  .switch::after{content:""; position:absolute; top:2.5px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); transition:.2s;}
  .switch.on{background:var(--marquee);} .switch.on::after{left:21px;}

  /* ---------- Motion system ---------- */
  @keyframes fadeUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes popIn{0%{transform:scale(.55); opacity:0;} 65%{transform:scale(1.12);} 100%{transform:scale(1); opacity:1;}}
  @keyframes heartPop{0%{transform:scale(1);} 35%{transform:scale(1.5) rotate(-6deg);} 100%{transform:scale(1);}}
  @keyframes flashRow{0%{background:var(--gold-soft);} 100%{background:transparent;}}
  @keyframes heroZoom{from{transform:scale(1.06); opacity:.6;} to{transform:scale(1); opacity:1;}}
  @keyframes marqueeGrow{from{width:0; opacity:0;} to{width:34px; opacity:1;}}
  @keyframes blinkDot{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);}}
  .screen:not(.hidden){animation:fadeUp .26s var(--spring);}
  .scrim{animation:fadeIn .2s ease;}
  #logStack .fcard:nth-child(1){animation-delay:0s;}
  #logStack .fcard:nth-child(2){animation-delay:.05s;}
  #logStack .fcard:nth-child(3){animation-delay:.1s;}
  #logStack .fcard:nth-child(4){animation-delay:.15s;}
  #logStack .fcard:nth-child(5){animation-delay:.2s;}
  #logStack .fcard{animation:rise .32s var(--spring) both;}
  .tab.active svg{animation:popIn .3s var(--spring);}
  .just-liked{display:inline-block; animation:heartPop .38s var(--spring);}
  .flash{animation:flashRow 1.4s ease-out;}
  .badge.result{animation:popIn .5s var(--spring) .15s both;}
  .vswrap{animation:fadeUp .22s var(--spring);}
  .bubble{animation:fadeUp .24s var(--spring);}
  .poster{transition:transform .15s var(--spring);}
  .listrow:active .poster{transform:scale(.96);}
  .tdots span{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gray); margin-right:4px; animation:blinkDot 1.1s infinite;}
  .tdots span:nth-child(2){animation-delay:.18s;} .tdots span:nth-child(3){animation-delay:.36s;}

  /* ---------- Cinema brand details ---------- */
  .wordmark{position:relative; display:inline-block;}
  .wordmark::after{content:""; position:absolute; left:2px; bottom:-1px; height:3px; width:34px;
    border-radius:999px; background:linear-gradient(90deg, var(--gold), rgba(201,162,39,.25));
    animation:marqueeGrow .6s var(--spring) .2s both;}
  .tagline{display:block; font-size:8.5px; letter-spacing:.32em; color:var(--gray); font-weight:700; margin-top:3px;}
  .letterbox::before, .letterbox::after{content:""; position:absolute; left:0; right:0; height:14px; background:#0c0c0c; z-index:1;}
  .letterbox::before{top:0;} .letterbox::after{bottom:0;}
  .hero-img{position:absolute; inset:0; background-size:cover; background-position:center; animation:heroZoom .5s var(--spring);}
  .ticket{position:relative; overflow:visible;}
  .ticket::before, .ticket::after{content:""; position:absolute; top:50%; width:22px; height:22px;
    border-radius:50%; background:rgba(15,22,23,.62); transform:translateY(-50%);}
  .ticket::before{left:-11px;} .ticket::after{right:-11px;}
  .perf{border-top:2px dashed rgba(255,255,255,.18); margin:14px -20px 0; padding-top:14px;}
  .toast{position:absolute; bottom:104px; left:50%; transform:translateX(-50%) translateY(8px); background:#F2EFE9;
    color:#121416; padding:11px 20px; border-radius:999px; font-size:13px; z-index:80; opacity:0;
    transition:.25s; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.3); pointer-events:none; max-width:88%; overflow:hidden; text-overflow:ellipsis;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .hist{display:flex; align-items:flex-end; gap:5px; height:92px; margin-top:12px;}
  .hist .bar{flex:1; background:linear-gradient(180deg,#E8B64C,#A87E2A); border-radius:4px 4px 0 0;}
  .barlabel{display:flex; gap:5px; font-size:10px; color:var(--gray); margin-top:5px;}
  .barlabel span{flex:1; text-align:center;}
  .dotbadge{position:absolute; top:-2px; right:-3px; width:8px; height:8px; border-radius:50%; background:#e2574c; border:1.5px solid var(--bg);}

  .empty{display:flex; flex-direction:column; align-items:center; gap:8px; padding:48px 32px; text-align:center;}
  .empty .big{font-size:36px;}

  /* Chat */
  .bubble{max-width:80%; padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.45; margin:4px 18px;}
  .bubble.user{background:var(--marquee); color:#fff; margin-left:auto; border-bottom-right-radius:6px;}
  .bubble.bot{background:var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.3); border-bottom-left-radius:6px;}
  .chatbar{display:flex; gap:9px; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:rgba(13,15,17,.95); border-top:1px solid var(--hair);}
  .chatbar input{flex:1; border:none; outline:none; background:rgba(255,255,255,.08); border-radius:18px; padding:11px 15px; font-size:14px; color:var(--ink);}
  .sendbtn{width:38px; height:38px; border-radius:50%; border:none; background:var(--marquee); color:#fff; font-size:17px; cursor:pointer;}
</style>
</head>
<body>
<div id="phone">
  <div class="statusbar"><span>1:37</span>
    <span style="display:flex; gap:6px; align-items:center;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#F2EFE9"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 16 12" fill="none" stroke="#F2EFE9" stroke-width="1.4"><path d="M1 4.5C3 2.5 5.4 1.5 8 1.5s5 1 7 3" stroke-linecap="round"/><path d="M3.5 7c1.3-1.2 2.8-1.8 4.5-1.8s3.2.6 4.5 1.8" stroke-linecap="round"/><circle cx="8" cy="10" r="1.3" fill="#F2EFE9" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#F2EFE9" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1.6" fill="#F2EFE9"/><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#F2EFE9" opacity=".4"/></svg>
    </span></div>

  <div class="screen" data-screen="feed" id="screen-feed"></div>
  <div class="screen hidden" data-screen="lists" id="screen-lists"></div>
  <div class="screen hidden" data-screen="search" id="screen-search"></div>
  <div class="screen hidden" data-screen="leaderboard" id="screen-leaderboard"></div>
  <div class="screen hidden" data-screen="profile" id="screen-profile"></div>
  <div class="screen hidden" data-screen="detail" id="screen-detail"></div>
  <div class="screen hidden" data-screen="chat" id="screen-chat" style="display:flex; flex-direction:column; padding-bottom:0;"></div>

  <button class="cinifab" id="cinifab" onclick="buzz(); go('chat')" aria-label="Ask Cini">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
  </button>

  <div id="overlayRoot"></div>
  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <button class="tab active" data-go="feed">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="17" y2="17"/></svg>
      Feed</button>
    <button class="tab" data-go="lists">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      Your Lists</button>
    <button class="tab center" onclick="openSearchForRank()"><span class="plus">+</span></button>
    <button class="tab" data-go="leaderboard">
      <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4a1 1 0 0 0-1 1 4 4 0 0 0 4 4"/><path d="M17 6h3a1 1 0 0 1 1 1 4 4 0 0 1-4 4"/></svg>
      Leaderboard</button>
    <button class="tab" data-go="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile</button>
  </div>
</div>

<script>
/* =====================================================================
   Cini interactive prototype — data-driven; every control works.

/* Appearance: dark (default) / light / match device. */
function applyTheme(){
  const pref=localStorage.getItem("cini-theme")||"dark";
  const light = pref==="light" || (pref==="auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  document.body.dataset.theme = light ? "light" : "dark";
}
function cycleTheme(){
  const order=["dark","light","auto"];
  const cur=localStorage.getItem("cini-theme")||"dark";
  const next=order[(order.indexOf(cur)+1)%order.length];
  localStorage.setItem("cini-theme", next);
  applyTheme();
  closeOverlay();
  toast({dark:"Dark — the screening room",light:"Light — the matinee",auto:"Matching your device"}[next]);
}
applyTheme();
window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

/* ---------- Mini ranking engine (mirrors the real RankingEngine) ---------- */
const BANDS = {loved:[6.7,10.0], fine:[3.4,6.6], disliked:[0,3.3]};
const ORDER = ["loved","fine","disliked"];
function scoredWatched(){
  const out=[]; let rank=1;
  for(const b of ORDER){
    const items=S.watched.filter(w=>w.b===b);
    items.forEach((w,i)=>{
      const [lo,hi]=BANDS[b];
      const score = items.length===1 ? hi : hi-(hi-lo)*i/(items.length-1);
      out.push({...w, rank:rank++, score:Math.round(score*10)/10});
    });
  }
  return out;
}
function scoreClass(s){ return s>=6.7?"g":(s>=3.4?"a":"r"); }
function myEntry(k){ return scoredWatched().find(w=>w.k===k); }

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }
function esc(s){ return s.replace(/"/g,"&quot;"); }
async function share(text){
  if(navigator.share){ try{ await navigator.share({title:"Cini", text, url:"https://jtsilver123.github.io/cini/prototype/"}); }catch(e){} }
  else toast("Link copied");
}
function deepLink(provider, title){
  const q=encodeURIComponent(title); const n=provider.toLowerCase();
  if(n.includes("netflix")) return `https://www.netflix.com/search?q=${q}`;
  if(n.includes("max")) return `https://play.max.com/search?q=${q}`;
  if(n.includes("hulu")) return `https://www.hulu.com/search?q=${q}`;
  if(n.includes("disney")) return `https://www.disneyplus.com/search?q=${q}`;
  if(n.includes("amazon")||n.includes("prime")) return `https://www.amazon.com/s?k=${q}&i=instant-video`;
  if(n.includes("apple")) return `https://tv.apple.com/search?term=${q}`;
  if(n.includes("peacock")) return `https://www.peacocktv.com/watch/search?q=${q}`;
  if(n.includes("paramount")) return `https://www.paramountplus.com/search/${q}/`;
  return `https://www.themoviedb.org/search?query=${q}`;
}

let currentScreen="feed", detailKey="dune2", searchTab="movies";
const RENDERERS = {
  feed:renderFeed, lists:renderLists, search:renderSearchScreen,
  leaderboard:renderLeaderboard, profile:renderProfile, detail:renderDetail, chat:renderChat,
};
function render(){
  const el=$("screen-"+currentScreen);
  const scroll=el.scrollTop;
  RENDERERS[currentScreen]();
  el.scrollTop=scroll;
}
let lastNonSearchScreen="feed";
function go(name){
  if(name!=="profile" && currentScreen==="profile") profileUser=null;
  if(currentScreen!=="search" && name==="search") lastNonSearchScreen=currentScreen;
  currentScreen=name;
  const fab=$("cinifab"); if(fab) fab.style.display = name==="chat" ? "none" : "flex";
  document.querySelectorAll("[data-screen]").forEach(s=>s.classList.toggle("hidden", s.dataset.screen!==name));
  document.querySelectorAll(".tab[data-go]").forEach(t=>t.classList.toggle("active", t.dataset.go===name));
  RENDERERS[name]();
  $("screen-"+name).scrollTop=0;
}
document.querySelectorAll(".tab[data-go]").forEach(t=>t.onclick=()=>{buzz(); go(t.dataset.go);});

/* ---------- Toggles ---------- */
function toggleWatchlist(k){
  buzz();
  const i=S.watchlist.indexOf(k);
  if(i>=0){ S.watchlist.splice(i,1); toast(`Removed ${MOVIES[k].t} from watchlist`); save(); render(); return; }
  if(S.watched.some(w=>w.k===k)){ toast("Already on your Watched list"); return; }
  // You have lists of your own — pick where this goes.
  openSaveTo(k);
}
function saveToWatchlist(k){
  S.watchlist.unshift(k); S.activity.unshift({kind:"watchlisted", k, when:"just now"});
  S.activity=S.activity.slice(0,8); save(); render();
  toast(`Saved ${MOVIES[k].t} to Want to Watch`);
}

function toggleLike(id){ buzz(); S.liked[id]=!S.liked[id]; if(S.liked[id]) _likedPop=id; save(); render(); setTimeout(()=>{_likedPop=null;},400); }
function likeIcon(id){ return S.liked[id] ? `<span class="${_likedPop===id?"just-liked":""}" style="color:#e0455e;">${IF("heart")}</span>` : I("heart"); }
function toggleFollow(u){
  buzz(); S.followed[u]=!S.followed[u];
  if(S.followed[u] && !S.notifs.some(n=>n.kind==="new_follower"&&n.who===u)){
    S.notifs.unshift({kind:"new_follower", who:u, when:"just now", unread:true});
  }
  save();
  toast(S.followed[u]?`Following @${u}`:`Unfollowed @${u}`); render();
}

          <button class="iconbtn" onclick="toast('Release calendar — in the app')">${I("calendar",21)}</button>

function setSubTab(t){ S.subTab=t; save(); render(); }
function setCategory(c){ S.category=c; save(); closeOverlay(); render(); }

  const pendingKeys=S.queue.filter(k=>!S.watched.some(w=>w.k===k));
  const sub=S.subTab;

  if(S.category!=="Movies"){
    content = `<div class="empty"><span style="color:var(--marquee);">${I("film",36,1.4)}</span>

    content = S.friendRecs.length===0

          <button class="pill" onclick="searchTab='members'; go('search')">${I("users",15)} Find friends</button>

      : S.friendRecs.map(r=>{
        const m=MOVIES[r.k]; if(!m) return "";
        return `<div style="padding:12px 18px; border-bottom:1px solid var(--hair);">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="avatar av1" style="width:26px;height:26px;font-size:11px;">${r.from[0].toUpperCase()}</div>
            <span style="font-size:12.5px;"><b>@${r.from}</b> thinks you'll love this</span>
            <span class="spacer"></span>
            <button class="iconbtn" onclick="dismissFriendRec('${r.id}')">${I("x",14)}</button>
          </div>
          <div class="listrow" style="padding:10px 0 0; border:none; cursor:pointer;" onclick="if(!event.target.closest('button'))openDetail('${r.k}')">
            <div class="poster" style="width:52px;height:78px; background-image:url('${IMG(m.p)}');"></div>

              <div style="font-weight:700; font-size:15.5px;">${m.t}</div>

  $("screen-lists").innerHTML = `

      <button class="pill ghost" onclick="toast('Decade filter — wired in the app')">Decade ${I("chevD",12)}</button>
      <button class="pill ghost" onclick="toast('Streaming filter — wired in the app')">Streaming ${I("chevD",12)}</button>
      <button class="pill ghost" onclick="toast('Runtime filter — wired in the app')">Runtime</button>
    </div>`:""}
    ${S.ui.showSearch?`<div class="pad" style="margin-top:10px;">
      <div class="searchfield">${I("search",16)}<input id="listQ" placeholder="Search this list" value="${esc(S.ui.listQ)}" oninput="S.ui.listQ=this.value; save(); renderListsKeepFocus()"></div>
    </div>`:""}
    ${S.ui.reorder && sub==="watched"?`<div class="pad" style="margin-top:10px; color:var(--marquee); font-size:12.5px; font-weight:700;">Reorder mode — use the arrows; scores update automatically</div>`:""}
    <div class="pad" style="display:flex; align-items:center; margin-top:8px;">
      <span style="color:var(--marquee); font-weight:700; font-size:14px;">↓↑ ${sub==="watched"?"Score":"Date Added"}</span>
      <span class="spacer"></span>
      <button class="iconbtn" onclick="openSearchForRank()">${I("search",18)}</button>
    </div>
    <div style="margin-top:4px;">${content}</div>
`;
}

/* Ask friends for a rec: multi-select friends + optional type/genre/note. */
let _askPicks=new Set(), _askType=null;
function toggleAskPick(u, el){
  if(_askPicks.has(u)){ _askPicks.delete(u); el.style.background=''; }
  else { _askPicks.add(u); el.style.background='var(--marquee-soft)'; }
}
function setAskType(t, el){
  _askType=t;
  document.querySelectorAll('[id^=asktype-]').forEach(e=>{e.style.background='rgba(255,255,255,.07)'; e.style.color='var(--ink)';});
  el.style.background='var(--marquee)'; el.style.color='#10100e';
}
function openAskRecs(){
  _askPicks=new Set(); _askType=null;
  renderSheet(`
    <div class="sheet-head"><b style="flex:1; font-size:17px;">Ask for Recs</b>

      <input id="askNote" placeholder="Add a note (optional) — e.g. movie night with my sister"

/* Typo-tolerant matching: edit distance vs the title and its prefix. */
function fuzzySim(q,t){
  if(t.includes(q)) return 1;
  const dist=(a,b)=>{
    const m=a.length,n=b.length;
    if(!m) return n; if(!n) return m;
    let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
        if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) cur[j]=Math.min(cur[j], prev[j-1]);
      }
      [prev,cur]=[cur,prev];
    }
    return prev[n];
  };
  const whole=1-dist(q,t)/Math.max(q.length,t.length);
  const pre=1-dist(q,t.slice(0,q.length))/q.length;
  return Math.max(whole, pre*0.95);
}

      decade:2010+((seed%2)*10), streak:3+(seed%9)};

  const counts={loved:0,fine:0,disliked:0}; const g={}; const d={}; let gt=0;

            <div class="sub" style="font-size:14px;">${o.y}${oScore?` · <b class="gtxt">${oScore.score.toFixed(1)}</b>`:""}</div>
          </div>
        </div>
        <div class="vsctrl">
          <button class="lnk ${log.history.length?"":"off"}" onclick="undoAnswer()">Undo</button>
          <button class="tough" onclick="resolveAt(log._mid+1)">Too tough</button>
          <button class="lnk" onclick="skipAnswer()">Skip</button>
        </div>
      </div>`;
  }

  if(log.stage==="result"){
    const e=myEntry(log.k);
    const ini = S.me.name.split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
    // Two-step reveal: the "…" ticket (rating screen) becomes the score
    // ticket (score screen) a beat later — tap to reveal early.
    const scoreSlot = log.revealed
      ? `<div class="badge result ${scoreClass(e.score)}">${e.score.toFixed(1)}</div>`
      : `<div class="badge" style="background:var(--surface); border:1.8px solid var(--hair); color:var(--gray); cursor:pointer;" onclick="revealScore()">…</div>`;
    html+=`
      <div class="fcard ticket" style="text-align:center;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:14px;">

          </div>
          <span style="font-weight:800; letter-spacing:.18em; font-size:12px; color:var(--marquee);">CINI</span>
        </div>
        <div class="poster" style="width:120px; height:180px; margin:0 auto; background-image:url('${IMG(m.p)}');"></div>
        <div class="serif" style="font-size:22px; margin-top:12px;">${m.t}</div>
        <div class="sub" style="font-size:12px;">${m.g[0]} · ${m.y}</div>
        <div style="display:flex; justify-content:center; margin:14px 0 8px;">${scoreSlot}</div>
        <b style="font-size:16px;">Ranked <span style="color:var(--gold);">#${e.rank}</span></b>
        <div class="sub" style="font-size:12px;">on your Watched list</div>
        ${S.streak>0?`<div style="display:inline-flex; gap:5px; align-items:center; color:var(--gold); font-size:11px; font-weight:800; margin-top:8px; padding:5px 11px; border-radius:999px; background:var(--marquee-soft);">${I("flame",12)} ${S.streak}-week streak</div>`:""}
        <div class="perf"></div>
        ${log.revealed?`<div style="display:flex; gap:10px;">
          <button class="pill out" style="flex:1; justify-content:center; padding:12px;" onclick="share('${esc(m.t)} — ranked #${e.rank} on Cini')">${I("send",16)} Share</button>
          <button class="pill" style="flex:1; justify-content:center; padding:12px;" onclick="finishLog()">Done</button>
        </div>`:`<div class="sub" style="font-size:12px;">Tap to reveal your score</div>`}
      </div>`;
  }
  return html;
}
function refreshLog(){ const el=$("logStack"); if(el){ el.innerHTML=logCards(); el.lastElementChild?.scrollIntoView({behavior:"smooth", block:"end"}); } }
function pickBucket(b){
  if(!log || log.stage==="compare" || log.stage==="result") return;
  buzz();
  S.watched=S.watched.filter(w=>w.k!==log.k);   // re-rank: remove first
  log.bucket=b; log.stage="enrich"; log.history=[]; log.skipOff=0;
  refreshLog();
}
function startCompare(){
  buzz();
  const n=bucketItems().length;
  log.low=0; log.high=n; log.history=[]; log.skipOff=0;
  if(n===0){ commitLog(0); } else { log.stage="compare"; refreshLog(); }
}
function answer(which){
  buzz();
  log.history.push({low:log.low, high:log.high, skipOff:log.skipOff});
  if(which==="new") log.high=log._mid; else log.low=log._mid+1;
  log.skipOff=0;
  if(log.low>=log.high) commitLog(log.low); else refreshLog();
}
function skipAnswer(){
  const span=log.high-log.low;
  if(span<=1 || log.skipOff+1>=span){ resolveAt(log._mid+1); return; }
  log.history.push({low:log.low, high:log.high, skipOff:log.skipOff});
  log.skipOff++; refreshLog();
}
function undoAnswer(){
  const s=log.history.pop(); if(!s) return;
  buzz(); Object.assign(log, s); refreshLog();
}
function resolveAt(pos){ commitLog(Math.min(pos, bucketItems().length)); }
function commitLog(pos){
  const others=bucketItems();
  others.splice(pos,0,log.k);
  const rebuilt=[];
  for(const b of ORDER){
    if(b===log.bucket) rebuilt.push(...others.map(k=>({k,b})));
    else rebuilt.push(...S.watched.filter(w=>w.b===b));
  }
  S.watched=rebuilt;
  if(S.queue.includes(log.k)){ S.queue=S.queue.filter(x=>x!==log.k); S.rankedFromImport++; }
  S.watchlist=S.watchlist.filter(x=>x!==log.k);
  if(!S.rankedThisWeek){ S.streak++; S.rankedThisWeek=true; }
  S.activity.unshift({kind:"ranked", k:log.k, when:"just now"}); S.activity=S.activity.slice(0,8);
  log.stage="result"; log.revealed=false; save(); refreshLog();
  // Auto-reveal the score a beat after the ticket lands (suspense → payoff).
  setTimeout(()=>{ if(log && log.stage==="result") revealScore(); }, 850);
}
function revealScore(){
  if(!log || log.revealed) return;
  log.revealed=true; buzz(); refreshLog();
}
let _flashKey=null;
function finishLog(){
  const e=myEntry(log.k);
  const name=MOVIES[log.k].t;
  _flashKey=log.k; log=null;
  closeOverlay(); S.subTab="watched"; save(); go("lists");
  toast(`${name} ranked #${e.rank} · ${e.score.toFixed(1)}`);
  setTimeout(()=>{_flashKey=null;},1500);
}

function chatComposer(){
  return `
    <div style="margin:0 16px 10px; background:var(--surface); border:1.2px solid rgba(232,182,76,.45); border-radius:22px; padding:14px;">
      ${chatAttach?`<span style="display:inline-flex; align-items:center; gap:6px; background:var(--marquee-soft); color:var(--marquee); font-size:12px; font-weight:700; border-radius:999px; padding:5px 10px; margin-bottom:8px;">${I("film",13)} ${MOVIES[chatAttach].t} <span style="cursor:pointer;" onclick="chatAttach=null; renderChat()">✕</span></span>`:""}
      <input id="chatInput" placeholder="Ask Cini anything…" style="width:100%; background:none; border:none; outline:none; color:var(--ink); font:inherit; font-size:16px; padding:2px 0 10px;" onkeydown="if(event.key==='Enter')askCini(this.value)">
      <div style="display:flex; align-items:center;">
        <button style="width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.09);color:var(--ink);font-size:18px;cursor:pointer;" onclick="openChatAttach()">+</button>
        <span class="spacer"></span>
        <button style="width:36px;height:36px;border-radius:50%;border:none;background:var(--marquee);color:var(--bg);font-weight:800;font-size:16px;cursor:pointer;" onclick="askCini($('chatInput').value)">↑</button>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin:0 16px 96px;">
      <button class="pill ghost" style="flex:1; justify-content:center; font-size:12px;" onclick="askCini('What should I watch tonight?')">🍿 What to watch</button>
      <button class="pill ghost" style="flex:1; justify-content:center; font-size:12px;" onclick="openChatReview()">✍️ Review a movie</button>
    </div>`;
}
function renderChat(){
  $("screen-chat").innerHTML=`
    <div class="pad" style="display:flex; align-items:center; padding-top:10px; flex:0 0 auto;">
      <button class="iconbtn" onclick="go('feed')">${I("x",22,2)}</button>
      <span class="spacer"></span>
    </div>
    ${chat.length===0?`
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="serif" style="font-size:34px; font-weight:700; line-height:1.2; padding:0 22px 20px;">Hi Jake,<br><span style="color:var(--marquee);">what are we watching?</span></div>
      ${chatComposer()}
      <div class="row-scroll" style="margin-top:2px;">
        ${["Something like my #1 but shorter","Date night pick from my watchlist","Surprise me with a hidden gem"].map(q=>
          `<button class="pill ghost" style="font-size:12px;" onclick="askCini('${esc(q)}')">${q}</button>`).join("")}
      </div>
    </div>`:`
    <div style="flex:1; overflow-y:auto; padding:14px 0;" id="chatScroll">
      ${chat.map(c=>`<div class="bubble ${c.u?"user":"bot"}">${c.t}${(c.acts||[]).map(a=>
        `<div style="display:inline-flex; align-items:center; gap:5px; margin-top:8px; padding:5px 10px; border:1px solid rgba(47,191,113,.5); border-radius:999px; color:var(--green); font-size:12px; font-weight:700; cursor:pointer;" onclick="buzz(); S.subTab='watchlist'; save(); go('lists')">${I("check",13,2.4)} ${a} ${I("chevR",11,2.6)}</div>`).join("")}</div>`).join("")}
      ${chat.length&&chat[chat.length-1].thinking?`<div style="display:flex; align-items:center; gap:8px; padding:4px 22px;"><span style="color:var(--marquee);">${I("spark",16)}</span><span class="sub" id="thinkPhrase" style="font-weight:700; font-size:12.5px;">${THINK_PHRASES[_thinkIdx%THINK_PHRASES.length]}</span></div>`:""}
    </div>
    ${chatComposer()}`}`;
  const sc=$("chatScroll"); if(sc) sc.scrollTop=sc.scrollHeight;
  const inp=$("chatInput"); if(inp&&chat.length===0) inp.focus();
}
function openChatAttach(){
  renderSheet(`
    <div class="sheet-head"><b style="flex:1; font-size:17px;">Talk about a movie</b>
      <button class="iconbtn" onclick="closeOverlay()">${I("x",18)}</button></div>
    <div class="sheet-body">
      ${Object.keys(MOVIES).map(k=>`<div class="erow" onclick="chatAttach='${k}'; closeOverlay(); renderChat(); setTimeout(()=>{const e=$('chatInput'); if(e)e.focus();},50)">
        <div class="poster" style="width:30px;height:45px; background-image:url('${IMG(MOVIES[k].p)}');"></div>
        <span style="flex:1; font-weight:600;">${MOVIES[k].t} <span class="sub">${MOVIES[k].y}</span></span>
      </div>`).join("")}
    </div>`);
}
function openChatReview(){
  renderSheet(`
    <div class="sheet-head"><b style="flex:1; font-size:17px;">Review a movie</b>
      <button class="iconbtn" onclick="closeOverlay()">${I("x",18)}</button></div>
    <div class="sheet-body">
      <div class="sub" style="margin-bottom:8px;">Pick one and the rating flow opens right here.</div>
      ${Object.keys(MOVIES).map(k=>`<div class="erow" onclick="closeOverlay(); openLog('${k}')">
        <div class="poster" style="width:30px;height:45px; background-image:url('${IMG(MOVIES[k].p)}');"></div>
        <span style="flex:1; font-weight:600;">${MOVIES[k].t} <span class="sub">${MOVIES[k].y}</span></span>
        <span class="sub">${I("plus",16)}</span>
      </div>`).join("")}
    </div>`);
}
function askCini(q){
  q=(q||"").trim();
  if(!q&&!chatAttach) return;
  const attached=chatAttach?MOVIES[chatAttach]:null;
  const visible=attached?`🎬 ${attached.t}${q?` — ${q}`:""}`:q;
  chatAttach=null;
  buzz(); chat.push({u:1,t:visible},{u:0,t:"",thinking:1}); renderChat();
  _thinkIdx=0;
  _thinkTimer=setInterval(()=>{ _thinkIdx++; const el=$("thinkPhrase"); if(el) el.textContent=THINK_PHRASES[_thinkIdx%THINK_PHRASES.length]; }, 1400);
  setTimeout(()=>{
    clearInterval(_thinkTimer);
    chat.pop();
    const wl=S.watchlist[0]?MOVIES[S.watchlist[0]]:null;
    const top=scoredWatched()[0]?MOVIES[scoredWatched()[0].k]:null;
    let a, acts=[];
    const ql=q.toLowerCase();
    // The agent ACTS: "save/add <title>" really lands on the watchlist,
    // with a receipt chip under the reply (mirrors the app's tools).
    const wantsSave=/\b(add|save|put|bookmark)\b/.test(ql);
    const namedKey=Object.keys(MOVIES).find(k=>ql.includes(MOVIES[k].t.toLowerCase()));
    if(wantsSave&&namedKey&&!S.watchlist.includes(namedKey)&&!S.watched.some(w=>w.k===namedKey)){
      S.watchlist.unshift(namedKey); save();
      a=`Done — <b>${MOVIES[namedKey].t}</b> (${MOVIES[namedKey].y}) is on your Want to Watch. ${MOVIES[namedKey].on?.[0]?`It's streaming on ${MOVIES[namedKey].on[0]} whenever you're ready.`:""}`;
      acts=[`Saved ${MOVIES[namedKey].t}`];
    }
    else if(attached) a=`<b>${attached.t}</b> (${attached.y})? ${attached.ov||"Great pick."} Given your taste I'd bet you land around ${Math.min(10,attached.avg+0.3).toFixed(1)}. Seen it already? Tap <b>Review a movie</b> below and make it count.`;
    else if(ql.includes("date")) a=`For date night: <b>Past Lives</b> (2023) — quiet, romantic, 1h 45m, on Paramount+. One pick, full confidence. Bring tissues.`;
    else if(ql.includes("short")&&top) a=`You loved <b>${top.t}</b> — same wavelength in under two hours: <b>The Zone of Interest</b> (1h 45m, on Max). Watch it tonight, thank me tomorrow.`;
    else if(wl) a=`Easy: <b>${wl.t}</b> is sitting right on your watchlist — ${wl.rt}, on ${wl.on[0]}, friends average ${wl.avg.toFixed(1)}. That's tonight's movie. Deal?`;
    else a=`Based on your top-ranked films: <b>Poor Things</b> (2023) — bold, funny, gorgeous, on Hulu. Save it or start it.`;
    revealWords(a, acts);
  }, 1700);
}
/* The reply lands word by word, like someone typing back. */
function revealWords(full, acts){
  chat.push({u:0,t:""});
  const idx=chat.length-1;
  const words=full.split(" ");
  let i=0;
  const t=setInterval(()=>{
    i++;
    chat[idx].t=words.slice(0,i).join(" ");
    const sc=$("chatScroll");
    const bubbles=sc?sc.querySelectorAll(".bubble"):[];
    if(bubbles.length) bubbles[bubbles.length-1].innerHTML=chat[idx].t;
    if(sc) sc.scrollTop=sc.scrollHeight;
    if(i>=words.length){ clearInterval(t); if(acts&&acts.length) chat[idx].acts=acts; renderChat(); }
  }, 45);
  renderChat();
}

/* =================== ONBOARDING (first run) =================== */
let obStep=0, obName="", obFullName="";
function obValid(){ return /^[a-z0-9_.]{3,30}$/.test(obName); }
function obInitials(){ return obFullName.trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function renderOnboarding(){
  const bar=`<div style="display:flex; gap:6px; padding:18px 28px 0;">${[0,1,2,3,4].map(i=>
    `<div style="flex:1; height:4px; border-radius:99px; background:${i<=obStep?"var(--gold)":"rgba(255,255,255,.1)"}; transition:background .3s;"></div>`).join("")}</div>`;
  let body="";
  if(obStep===0) body=`
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:0 30px; text-align:center;">
      <div class="serif" style="font-size:54px; font-weight:700;">cini</div>
      <div style="font-size:11px; letter-spacing:.35em; color:var(--gray); font-weight:700;">EVERY FILM · RANKED</div>
      <div class="sub" style="font-size:14px;">Rank what you watch. No star ratings, ever.</div>
      <button style="margin-top:22px; background:#fff; color:#000; border:none; border-radius:999px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="obNext()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M16.4 12.9c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1 1-3.9 1-.8 0-2-.9-3.4-.9C5.8 7.1 4.1 8.1 3.2 9.7c-1.9 3.3-.5 8.1 1.4 10.8.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.4zM13.7 4.4c.7-.9 1.2-2.1 1.1-3.4-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.4z"/></svg>
        Continue with Apple</button>
      <div style="display:flex; align-items:center; gap:10px;"><div style="flex:1;height:1px;background:var(--hair);"></div><span class="sub">or with email</span><div style="flex:1;height:1px;background:var(--hair);"></div></div>
      <input placeholder="Email" style="background:var(--surface-2); border:1px solid var(--hair); border-radius:12px; padding:13px; color:var(--ink); font:inherit; outline:none;">
      <input placeholder="Password" type="password" style="background:var(--surface-2); border:1px solid var(--hair); border-radius:12px; padding:13px; color:var(--ink); font:inherit; outline:none;">
      <button class="pill" style="justify-content:center; padding:13px;" onclick="obNext()">Sign in</button>
    </div>`;
  else if(obStep===1) body=`
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; padding:0 32px; text-align:center;">
      <b style="font-size:21px;">No star ratings. Ever.</b>
      <div class="sub" style="font-size:14px; line-height:1.55;">You'll answer one question — <b style="color:var(--ink);">"Which did you like more?"</b> — and Cini builds your perfectly ordered list, with scores that come from your own taste.</div>
      <div style="display:flex; justify-content:center; gap:22px; margin-top:8px;">
        ${[["--s-loved","Liked it"],["--s-fine","Fine"],["--s-disliked","Didn't"]].map(([c,l])=>
          `<div><div style="width:52px;height:52px;border-radius:50%;background:var(${c});margin:0 auto;"></div><div class="sub" style="margin-top:7px;">${l}</div></div>`).join("")}
      </div>
      <button class="pill" style="justify-content:center; padding:13px; margin-top:18px;" onclick="obNext()">Get started</button>
    </div>`;
  else if(obStep===2) body=`
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:0 30px; text-align:center;">
      <div class="serif" style="font-size:32px; font-weight:700;">Claim your @</div>
      <div class="sub">This is how friends find and follow you.</div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:7px;">
        <div class="avatar av1" id="obAv" style="width:84px; height:84px; font-size:30px; cursor:pointer;"
          onclick="toast('Photo picker opens here — skip it and your initials stand in')">${obInitials()||"+"}</div>
        <div class="sub" style="font-size:11.5px;">Add a photo</div>
      </div>
      <input id="obFull" value="${obFullName}" placeholder="Your name" style="background:var(--surface-2); border:1px solid var(--hair); border-radius:12px; padding:13px; color:var(--ink); font:inherit; outline:none;"
        oninput="obFullName=this.value; $('obAv').textContent=obInitials()||'+';">
      <div style="display:flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:12px; padding:13px;">
        <span class="sub">@</span>
        <input id="obUser" value="${obName}" placeholder="username" style="flex:1; background:none; border:none; outline:none; color:var(--ink); font:inherit;"
          oninput="obName=this.value.toLowerCase(); $('obCheck').style.opacity=obValid()?1:0; $('obGo').style.opacity=obValid()?1:.5; const b=$('obBar'); if(b){b.style.width=(Math.min(obName.length/3,1)*100)+'%'; b.style.background=obName.length>=3?'var(--green)':'var(--marquee)';}">
        <span id="obCheck" class="gtxt" style="opacity:${obValid()?1:0}; transition:.2s;">${I("check",17,2.4)}</span>
      </div>
      <div style="height:4px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden;">
        <div id="obBar" style="height:100%; border-radius:999px; transition:width .2s, background .2s;
          width:${Math.min(obName.length/3,1)*100}%; background:${obName.length>=3?"var(--green)":"var(--marquee)"};"></div>
      </div>
      <div class="sub" style="font-size:11.5px;">At least 3 characters — lowercase letters, numbers, underscores.</div>
      <button id="obGo" class="pill" style="justify-content:center; padding:13px; opacity:${obValid()?1:.5};" onclick="if(obValid())obNext(); else toast('Pick a valid username first')">That's me</button>
    </div>`;
  else if(obStep===3) body=`
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:0 30px; text-align:center;">
      <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
        <div style="display:flex; padding:11px 13px; background:#1A2128; border-radius:14px;">
          <div style="width:22px;height:22px;border-radius:50%;background:#FF8000;"></div>
          <div style="width:22px;height:22px;border-radius:50%;background:#00E054;margin-left:-7px;"></div>
          <div style="width:22px;height:22px;border-radius:50%;background:#40BCF4;margin-left:-7px;"></div>
        </div>
        <span style="color:var(--gray); font-weight:800;">\u2192</span>
        <div class="serif" style="color:var(--marquee); font-size:21px; padding:5px 15px; background:#121011; border:1px solid rgba(232,182,76,.55); border-radius:14px;">cini</div>
      </div>
      <div class="serif" style="font-size:32px; font-weight:700;">Bring your history</div>
      <div class="sub" style="line-height:1.5;">Already track movies somewhere? Cini queues your whole history so you can rank it — favorites first.</div>
      <button class="pill" style="justify-content:center; padding:13px; margin-top:8px;" onclick="finishOnboarding(); openImport();">Import Letterboxd or IMDb</button>
      <button class="pill out" style="justify-content:center; padding:13px;" onclick="finishOnboarding(); openImport(); importPaste();">Paste from Apple Notes</button>
      <button style="background:none; border:none; color:var(--gray); font:inherit; font-weight:600; cursor:pointer; margin-top:10px;" onclick="obNext()">I'm starting fresh</button>
    </div>`;
  else body=`
    <div style="flex:1; display:flex; flex-direction:column; gap:12px; padding:24px 24px 0; text-align:center; overflow-y:auto;">
      <div class="serif" style="font-size:28px; font-weight:700;">Rank your first movie</div>
      <div class="sub">Pick anything you've seen — your first one takes zero comparisons.</div>
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px;">
        ${Object.keys(MOVIES).slice(0,6).map(k=>`
          <div style="cursor:pointer;" onclick="finishOnboarding(); openLog('${k}')">
            <div class="poster" style="width:100%; aspect-ratio:2/3; background-image:url('${IMG(MOVIES[k].p)}');"></div>
            <div style="font-size:11px; font-weight:600; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${MOVIES[k].t}</div>
          </div>`).join("")}
      </div>
      <button style="background:none; border:none; color:var(--gray); font:inherit; font-weight:600; cursor:pointer; padding:16px 0 24px;" onclick="finishOnboarding()">I'll explore first</button>
    </div>`;
  $("overlayRoot").innerHTML=`<div style="position:absolute; inset:0; z-index:70; background:var(--bg); display:flex; flex-direction:column;" id="obWrap">${bar}${body}</div>`;
}
function obNext(){ buzz(); obStep++; if(obStep>4){ finishOnboarding(); return; } renderOnboarding(); }
function finishOnboarding(){ S.onboarded=true; save(); $("overlayRoot").innerHTML=""; render(); }

/* =================== BOOT =================== */
go("feed");
if(!S.onboarded) renderOnboarding();
</script>
</body>
