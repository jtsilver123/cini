<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14555A">
<title>Cini — Prototype</title>
<style>
  :root{
    --teal:#14555A; --teal-soft:rgba(20,85,90,.10); --ink:#121416; --bg:#FAF7F2;
    --gray:#8A8F98; --green:#1F9D55; --amber:#C9881A; --red:#B54A4A;
    --hair:rgba(0,0,0,.09);
    --s-loved:#53B17C; --s-fine:#F4C95C; --s-disliked:#EE9E9E;
    --shadow:0 8px 28px rgba(20,30,30,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#e7e3dc;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);}
  .serif{font-family:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;}

  #phone{position:relative; width:100%; max-width:430px; margin:0 auto; height:100vh; height:100dvh;
    background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.25);}
  @media(min-width:480px){
    body{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
    #phone{height:880px; border-radius:48px; border:12px solid #0c0c0c;}
  }

  .statusbar{display:flex; justify-content:space-between; align-items:center;
    padding:12px 24px 4px; font-size:14px; font-weight:700; flex:0 0 auto;}

  .screen{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:110px;}
  .pad{padding:0 18px;}
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* Tab bar */
  .tabbar{position:absolute; bottom:0; left:0; right:0; height:86px; z-index:30;
    background:rgba(252,250,246,.9); backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--hair); display:flex; align-items:flex-start;
    justify-content:space-around; padding-top:9px;}
  .tab{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px;
    color:var(--gray); border:none; background:none; flex:1; cursor:pointer; font-weight:500;}
  .tab.active{color:var(--teal); font-weight:700;}
  .tab svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .tab.center .plus{width:56px; height:56px; border-radius:50%; margin-top:-26px;
    background:linear-gradient(160deg,#1A6B71,#0F4347); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:30px; font-weight:300;
    box-shadow:0 8px 20px rgba(20,85,90,.45), inset 0 1px 0 rgba(255,255,255,.25);}

  /* Pills, badges, cards */
  .pill{display:inline-flex; align-items:center; gap:7px; background:var(--teal); color:#fff;
    border:none; border-radius:999px; padding:10px 17px; font-size:13.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; box-shadow:0 3px 10px rgba(20,85,90,.25); transition:transform .12s;}
  .pill:active{transform:scale(.95);}
  .pill.out{background:#fff; color:var(--teal); border:1.4px solid var(--teal); box-shadow:none;}
  .pill.ghost{background:#fff; color:var(--ink); border:1px solid var(--hair); box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .pill.ghost.on{background:var(--teal); color:#fff; border-color:var(--teal);}
  .row-scroll{display:flex; gap:10px; overflow-x:auto; padding:6px 18px 8px; scrollbar-width:none;}
  .row-scroll::-webkit-scrollbar{display:none;}

  .badge{width:52px; height:52px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17.5px;
    position:relative; flex:0 0 auto; box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .badge.sm{width:44px; height:44px; font-size:15px;}
  .badge.g{border:1.8px solid rgba(31,157,85,.45); color:var(--green);}
  .badge.a{border:1.8px solid rgba(201,136,26,.45); color:var(--amber);}
  .badge.r{border:1.8px solid rgba(181,74,74,.45); color:var(--red);}
  .badge .chip{position:absolute; bottom:-3px; right:-4px; background:var(--teal); color:#fff;
    font-size:9px; font-weight:800; padding:2.5px 6px; border-radius:999px; border:1.5px solid #fff;}
  .gtxt{color:var(--green);}

  .poster{border-radius:10px; background-size:cover; background-position:center;
    box-shadow:0 5px 14px rgba(0,0,0,.18); flex:0 0 auto; background-color:#22383a;}

  .card{background:#fff; border-radius:20px; padding:18px; margin:0 18px; box-shadow:var(--shadow);}
  h2.section{font-size:11.5px; letter-spacing:.08em; color:var(--gray); font-weight:700; margin:20px 18px 10px;}
  .wordmark{font-size:32px; color:var(--teal); font-weight:700; letter-spacing:-.5px;}

  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; flex:0 0 auto; background:linear-gradient(140deg,#88aab0,#5d818a); cursor:pointer;}
  .av1{background:linear-gradient(140deg,#c98ba8,#9a5677);} .av2{background:linear-gradient(140deg,#8ba8c9,#56779a);}
  .av3{background:linear-gradient(140deg,#c9b08b,#9a8156);} .av4{background:linear-gradient(140deg,#9dc98b,#6f9a56);}

  .listrow{display:flex; gap:13px; padding:15px 18px; border-bottom:1px solid var(--hair); align-items:flex-start;}
  .meta{opacity:.78; font-size:13.5px; margin-top:1px;} .sub{color:var(--gray); font-size:12px;}
  .iconbtn{background:none; border:none; font-size:19px; cursor:pointer; padding:2px; color:var(--ink); transition:transform .12s;}
  .iconbtn:active{transform:scale(1.25);}
  .spacer{flex:1;}

  .subtabs{display:flex; gap:24px; padding:12px 18px 0; overflow-x:auto; scrollbar-width:none;}
  .subtab{font-size:14.5px; color:var(--gray); padding-bottom:9px; border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-left:none; border-right:none; border-top:none;}
  .subtab.active{color:var(--ink); font-weight:700; border-bottom-color:var(--ink);}

  .seg{display:flex; background:rgba(0,0,0,.05); border-radius:999px; padding:4px; margin:0 18px;}
  .seg button{flex:1; border:none; background:none; padding:9px 2px; border-radius:999px; font-size:12.5px; cursor:pointer; color:var(--ink);}
  .seg button.active{background:#fff; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.1);}

  .searchfield{display:flex; gap:9px; align-items:center; background:#fff; border:1px solid var(--hair);
    border-radius:14px; padding:12px 14px; font-size:14px; box-shadow:0 1px 4px rgba(0,0,0,.03);}
  .searchfield input{border:none; outline:none; flex:1; font-size:14px; background:none; color:var(--ink);}

  /* Overlays */
  .overlay{position:absolute; inset:0; z-index:50; overflow-y:auto;
    background:rgba(15,22,23,.62); backdrop-filter:blur(3px);
    padding:16px 14px 40px; display:flex; flex-direction:column; gap:11px;}
  .fcard{background:#fff; border-radius:22px; padding:18px 20px; box-shadow:0 14px 38px rgba(10,20,20,.22);
    animation:rise .28s cubic-bezier(.2,.9,.3,1);}
  @keyframes rise{from{transform:translateY(26px); opacity:0;} to{transform:none; opacity:1;}}

  .sheet{position:absolute; left:0; right:0; bottom:0; max-height:86%; background:var(--bg); z-index:60;
    border-radius:24px 24px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25); display:flex; flex-direction:column;
    animation:slideup .25s cubic-bezier(.2,.9,.3,1);}
  @keyframes slideup{from{transform:translateY(40%); opacity:.5;} to{transform:none; opacity:1;}}
  .sheet-head{display:flex; align-items:center; padding:16px 18px 10px;}
  .sheet-body{flex:1; overflow-y:auto; padding:4px 18px 28px;}
  .grabber{width:38px; height:5px; border-radius:999px; background:rgba(0,0,0,.15); margin:8px auto 0;}
  .scrim{position:absolute; inset:0; background:rgba(15,22,23,.45); z-index:55;}

  .circles{display:flex; margin-top:16px;}
  .circ-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:11px; cursor:pointer; background:none; border:none;}
  .circ{width:64px; height:64px; border-radius:50%; transition:.2s; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:25px; font-weight:700; box-shadow:inset 0 -3px 8px rgba(0,0,0,.06);}
  .circ-opt span{font-size:13.5px; color:var(--ink); text-align:center;}
  .circ-opt.dim .circ{opacity:.4;} .circ-opt.dim span{color:var(--gray);}
  .circ-opt.sel .circ{transform:scale(1.08); box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .circ-opt.sel span{font-weight:700;}

  .vswrap{display:flex; align-items:stretch; margin:18px 0 4px; position:relative;}
  .vscard{flex:1; border:1.5px solid rgba(20,85,90,.75); border-radius:18px; min-height:166px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    cursor:pointer; padding:14px; transition:.15s; background:#fff;}
  .vscard:active{background:var(--teal-soft); transform:scale(.97);}
  .orb{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:44px; height:44px;
    border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:13px; font-weight:900; z-index:2; box-shadow:0 3px 10px rgba(20,85,90,.4);}
  .vsctrl{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding:0 4px;}
  .lnk{color:var(--teal); font-weight:700; font-size:14.5px; cursor:pointer; background:none; border:none; display:flex; gap:6px; align-items:center;}
  .lnk.off{color:rgba(138,143,152,.5);}
  .tough{border:1.5px solid var(--teal); border-radius:999px; padding:10px 18px; color:var(--teal);
    font-weight:700; font-size:14.5px; cursor:pointer; background:#fff;}

  .erow{display:flex; gap:15px; align-items:center; padding:14px 0; border-bottom:1px solid var(--hair); cursor:pointer;}
  .erow .ic{width:26px; text-align:center; font-size:17px;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 13px 41px; scrollbar-width:none; border-bottom:1px solid var(--hair);}
  .chips::-webkit-scrollbar{display:none;}
  .chip-f{background:rgba(0,0,0,.05); border:none; border-radius:11px; padding:9px 14px; font-size:13px; white-space:nowrap; cursor:pointer; color:var(--ink);}
  .chip-f.on{background:var(--teal); color:#fff;}
  .switch{width:48px; height:29px; border-radius:999px; background:rgba(0,0,0,.12); position:relative; cursor:pointer; transition:.2s; flex:0 0 auto; border:none;}
  .switch::after{content:""; position:absolute; top:2.5px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); transition:.2s;}
  .switch.on{background:var(--teal);} .switch.on::after{left:21px;}

  .toast{position:absolute; bottom:104px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink);
    color:#fff; padding:11px 20px; border-radius:999px; font-size:13px; z-index:80; opacity:0;
    transition:.25s; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.3); pointer-events:none; max-width:88%; overflow:hidden; text-overflow:ellipsis;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .hist{display:flex; align-items:flex-end; gap:5px; height:92px; margin-top:12px;}
  .hist .bar{flex:1; background:linear-gradient(180deg,#1A6B71,#14555A); border-radius:4px 4px 0 0;}
  .barlabel{display:flex; gap:5px; font-size:10px; color:var(--gray); margin-top:5px;}
  .barlabel span{flex:1; text-align:center;}
  .dotbadge{position:absolute; top:-2px; right:-3px; width:8px; height:8px; border-radius:50%; background:#e2574c; border:1.5px solid var(--bg);}

  .empty{display:flex; flex-direction:column; align-items:center; gap:8px; padding:48px 32px; text-align:center;}
  .empty .big{font-size:36px;}

  /* Chat */
  .bubble{max-width:80%; padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.45; margin:4px 18px;}
  .bubble.user{background:var(--teal); color:#fff; margin-left:auto; border-bottom-right-radius:6px;}
  .bubble.bot{background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); border-bottom-left-radius:6px;}
  .chatbar{display:flex; gap:9px; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:rgba(252,250,246,.95); border-top:1px solid var(--hair);}
  .chatbar input{flex:1; border:none; outline:none; background:rgba(0,0,0,.05); border-radius:18px; padding:11px 15px; font-size:14px;}
  .sendbtn{width:38px; height:38px; border-radius:50%; border:none; background:var(--teal); color:#fff; font-size:17px; cursor:pointer;}
</style>
</head>
<body>
<div id="phone">
  <div class="statusbar"><span>1:37</span>
    <span style="display:flex; gap:6px; align-items:center;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#121416"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 16 12" fill="none" stroke="#121416" stroke-width="1.4"><path d="M1 4.5C3 2.5 5.4 1.5 8 1.5s5 1 7 3" stroke-linecap="round"/><path d="M3.5 7c1.3-1.2 2.8-1.8 4.5-1.8s3.2.6 4.5 1.8" stroke-linecap="round"/><circle cx="8" cy="10" r="1.3" fill="#121416" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#121416" opacity=".4"/><rect x="2" y="2" width="14" height="8" rx="1.6" fill="#121416"/><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#121416" opacity=".4"/></svg>
    </span></div>

  <div class="screen" data-screen="feed" id="screen-feed"></div>
  <div class="screen hidden" data-screen="lists" id="screen-lists"></div>
  <div class="screen hidden" data-screen="search" id="screen-search"></div>
  <div class="screen hidden" data-screen="leaderboard" id="screen-leaderboard"></div>
  <div class="screen hidden" data-screen="profile" id="screen-profile"></div>
  <div class="screen hidden" data-screen="detail" id="screen-detail"></div>
  <div class="screen hidden" data-screen="chat" id="screen-chat" style="display:flex; flex-direction:column; padding-bottom:0;"></div>

  <div id="overlayRoot"></div>
  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <button class="tab active" data-go="feed">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="17" y2="17"/></svg>
      Feed</button>
    <button class="tab" data-go="lists">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      Your Lists</button>
    <button class="tab center" onclick="openSearchForRank()"><span class="plus">+</span></button>
    <button class="tab" data-go="leaderboard">
      <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4a1 1 0 0 0-1 1 4 4 0 0 0 4 4"/><path d="M17 6h3a1 1 0 0 1 1 1 4 4 0 0 1-4 4"/></svg>
      Leaderboard</button>
    <button class="tab" data-go="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile</button>
  </div>
</div>

<script>
/* =====================================================================
   Cini interactive prototype — data-driven; every control works.
   State persists in localStorage. Per-screen rendering preserves scroll.
   ===================================================================== */

const IMG = p => `https://image.tmdb.org/t/p/w342/${p}.jpg`;

/* ---------- SVG icon system (consistent 1.7px stroke, like the tab bar) */
const ICONS = {
  heart:'<path d="M12 20s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 11C19 15.4 12 20 12 20z"/>',
  comment:'<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 21l-4-8-8-4z"/>',
  plus:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="8.5" x2="12" y2="15.5"/><line x1="8.5" y1="12" x2="15.5" y2="12"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',
  bell:'<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>',
  menu:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>',
  share:'<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  play:'<polygon points="6 4 20 12 6 20"/>',
  tv:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/>',
  x:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  chevL:'<polyline points="14 5 7 12 14 19"/>',
  chevR:'<polyline points="9 5 16 12 9 19"/>',
  chevD:'<polyline points="6 9 12 15 18 9"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.2" fill="currentColor" stroke="none"/>',
  download:'<path d="M12 3v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  shield:'<path d="M12 3l8 3v6c0 4.4-3.4 8-8 9-4.6-1-8-4.6-8-9V6z"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 6.3"/><polyline points="20 4 20 11 13 11"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><line x1="21" y1="12" x2="9" y2="12"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.6M6.2 6.2C4 7.6 2.5 9.8 2 12c1 2.5 5 7 10 7 1.5 0 2.9-.4 4.1-1"/>',
  tag:'<path d="M3 11V4a1 1 0 0 1 1-1h7l10 10-8 8z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/>',
  pencil:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>',
  star:'<polygon points="12 3 14.7 8.6 21 9.5 16.5 13.8 17.6 20 12 17 6.4 20 7.5 13.8 3 9.5 9.3 8.6"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.9M18.6 14.9c1.9.8 3.4 2.4 3.4 4.6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',

/* ---------- Mini ranking engine (mirrors the real RankingEngine) ---------- */
const BANDS = {loved:[6.7,10.0], fine:[3.4,6.6], disliked:[0,3.3]};
const ORDER = ["loved","fine","disliked"];
function scoredWatched(){
  const out=[]; let rank=1;
  for(const b of ORDER){
    const items=S.watched.filter(w=>w.b===b);
    items.forEach((w,i)=>{
      const [lo,hi]=BANDS[b];
      const score = items.length===1 ? hi : hi-(hi-lo)*i/(items.length-1);
      out.push({...w, rank:rank++, score:Math.round(score*10)/10});
    });
  }
  return out;
}
function scoreClass(s){ return s>=6.7?"g":(s>=3.4?"a":"r"); }
function myEntry(k){ return scoredWatched().find(w=>w.k===k); }

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }
function esc(s){ return s.replace(/"/g,"&quot;"); }
async function share(text){
  if(navigator.share){ try{ await navigator.share({title:"Cini", text, url:"https://jtsilver123.github.io/cini/prototype/"}); }catch(e){} }
  else toast("Link copied");
}
function deepLink(provider, title){
  const q=encodeURIComponent(title); const n=provider.toLowerCase();
  if(n.includes("netflix")) return `https://www.netflix.com/search?q=${q}`;
  if(n.includes("max")) return `https://play.max.com/search?q=${q}`;
  if(n.includes("hulu")) return `https://www.hulu.com/search?q=${q}`;
  if(n.includes("disney")) return `https://www.disneyplus.com/search?q=${q}`;
  if(n.includes("amazon")||n.includes("prime")) return `https://www.amazon.com/s?k=${q}&i=instant-video`;
  if(n.includes("apple")) return `https://tv.apple.com/search?term=${q}`;
  if(n.includes("peacock")) return `https://www.peacocktv.com/watch/search?q=${q}`;
  if(n.includes("paramount")) return `https://www.paramountplus.com/search/${q}/`;
  return `https://www.themoviedb.org/search?query=${q}`;
}

/* =================== LOG FLOW (Beli order: sentiment → details → compare → result) */
let log=null;
function openLog(k){
  buzz();
  log={k, bucket:null, stage:"sentiment", snapshot:JSON.stringify(S.watched)};
  renderOverlay(`<div id="logStack" style="display:flex; flex-direction:column; gap:11px;">${logCards()}</div>`);
}
function closeLog(){
  // Abandoned mid-flow: restore the list (a re-rank removes the entry early).
  if(log && log.stage!=="result" && log.snapshot){ S.watched=JSON.parse(log.snapshot); save(); }
  log=null; closeOverlay();
}
function bucketItems(){ return S.watched.filter(w=>w.b===log.bucket && w.k!==log.k).map(w=>w.k); }
function logCards(){
  const m=MOVIES[log.k];
  let html=`
    <div class="fcard" style="display:flex; align-items:flex-start; gap:12px;">
      <div style="flex:1;">
        <div class="serif" style="font-size:25px; font-weight:700;">${m.t}</div>
        <div class="sub" style="font-size:14px; margin-top:2px;">${m.y} | ${m.g.join(", ")}</div>
      </div>
      <button class="iconbtn" onclick="closeLog()">${I("x",20)}</button>
    </div>
    <div class="fcard" style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:15.5px;">Add to my list of</span>
      <button style="display:inline-flex; align-items:center; gap:8px; border:1.4px solid var(--ink); background:none; border-radius:13px; padding:9px 15px; font-weight:700; font-size:15px; cursor:pointer;" onclick="toast('Movies · TV · Docs · Anime — switch in Your Lists')">${I("film",16)} Movies ${I("chevD",13)}</button>
    </div>
    <div class="fcard">
      <div style="text-align:center; font-size:18px; font-weight:800;">How was it?</div>
      <div class="circles">
        ${[["loved","I liked it!","--s-loved"],["fine","It was fine","--s-fine"],["disliked","I didn't like it","--s-disliked"]].map(([b,l,c])=>`
          <button class="circ-opt ${log.bucket? (log.bucket===b?"sel":"dim"):""}" onclick="pickBucket('${b}')">
            <div class="circ" style="background:var(${c});">${log.bucket===b?"✓":""}</div><span>${l}</span>
          </button>`).join("")}
      </div>
    </div>`;

  // Details card right after sentiment (Beli's order), before comparisons.
  if(log.bucket){
    html+=`
      <div class="fcard">
        <div class="erow" style="padding-top:2px;"><span class="ic">${I("users",18)}</span><span style="flex:1;">Who did you watch with?</span></div>
        <div class="chips">${MEMBERS.slice(0,3).map(p=>`<button class="chip-f" onclick="this.classList.toggle('on')">${p.n}</button>`).join("")}</div>
        ${[["tag","Add labels (date night, etc.)"],["pencil","Add notes"],["star","Add favorite performances"],["calendar","Add watch date"],["eyeoff","Add personal notes"]].map(([ic,l])=>
          `<div class="erow" onclick="toast('${l} — full editor in the app')"><span class="ic">${I(ic,18)}</span><span style="flex:1;">${l}</span><span class="sub">${I("chevR",14)}</span></div>`).join("")}
        <div class="erow" style="cursor:default;">
          <span class="ic">${I("lock",18)}</span>
          <span style="flex:1;">Stealth mode<div class="sub" style="margin-top:1px;">Hide this activity from the feed</div></span>
          <button class="switch" onclick="this.classList.toggle('on')"></button>
        </div>
        ${log.stage==="enrich"?`<button style="width:100%; border:none; background:none; color:var(--teal); font-size:18px; font-weight:800; padding:15px 0 4px; cursor:pointer;" onclick="startCompare()">Okay</button>`:""}
      </div>`;
  }

  if(log.stage==="compare"){
    const items=bucketItems();
    const span=log.high-log.low;
    const mid=log.low + (Math.floor(span/2)+log.skipOff)%span;
    const o=MOVIES[items[mid]];
    const oScore=myEntry(items[mid]);
    log._mid=mid;
    html+=`
      <div class="fcard">
        <div style="text-align:center; font-size:18px; font-weight:800;">Which do you prefer?</div>
        <div class="vswrap">
          <div class="vscard" style="margin-right:8px;" onclick="answer('new')">
            <div class="serif" style="font-size:19px; font-weight:700; text-align:center;">${m.t}</div>
            <div class="sub" style="font-size:14px;">${m.y}</div>
          </div>
          <div class="orb">OR</div>
          <div class="vscard" style="margin-left:8px;" onclick="answer('existing')">
            <div class="serif" style="font-size:19px; font-weight:700; text-align:center;">${o.t}</div>
            <div class="sub" style="font-size:14px;">${o.y}${oScore?` · <b class="gtxt">${oScore.score.toFixed(1)}</b>`:""}</div>
          </div>
        </div>
        <div class="vsctrl">
          <button class="lnk ${log.history.length?"":"off"}" onclick="undoAnswer()">Undo</button>
          <button class="tough" onclick="resolveAt(log._mid+1)">Too tough</button>
          <button class="lnk" onclick="skipAnswer()">Skip</button>
        </div>
      </div>`;
  }

  if(log.stage==="result"){
    const e=myEntry(log.k);
    html+=`
      <div class="fcard">
        <div style="display:flex; gap:13px; align-items:center;">
          <div class="poster" style="width:46px;height:69px; background-image:url('${IMG(m.p)}');"></div>
          <div style="flex:1;"><b style="font-size:17px;">Ranked #${e.rank}</b><div class="sub" style="margin-top:1px;">on your Watched list</div></div>
          <div class="badge ${scoreClass(e.score)}">${e.score.toFixed(1)}</div>
        </div>
        <button class="pill" style="width:100%; justify-content:center; padding:13px; margin-top:16px;" onclick="finishLog()">Done</button>
      </div>`;
  }
  return html;
}
function refreshLog(){ const el=$("logStack"); if(el){ el.innerHTML=logCards(); el.lastElementChild?.scrollIntoView({behavior:"smooth", block:"end"}); } }
function pickBucket(b){
  if(!log || log.stage==="compare" || log.stage==="result") return;
  buzz();
  S.watched=S.watched.filter(w=>w.k!==log.k);   // re-rank: remove first
  log.bucket=b; log.stage="enrich"; log.history=[]; log.skipOff=0;
  refreshLog();
}
function startCompare(){
  buzz();
  const n=bucketItems().length;
  log.low=0; log.high=n; log.history=[]; log.skipOff=0;
  if(n===0){ commitLog(0); } else { log.stage="compare"; refreshLog(); }
}
function answer(which){
  buzz();
  log.history.push({low:log.low, high:log.high, skipOff:log.skipOff});
  if(which==="new") log.high=log._mid; else log.low=log._mid+1;
  log.skipOff=0;
  if(log.low>=log.high) commitLog(log.low); else refreshLog();
}
function skipAnswer(){
  const span=log.high-log.low;
  if(span<=1 || log.skipOff+1>=span){ resolveAt(log._mid+1); return; }
  log.history.push({low:log.low, high:log.high, skipOff:log.skipOff});
  log.skipOff++; refreshLog();
}
function undoAnswer(){
  const s=log.history.pop(); if(!s) return;
  buzz(); Object.assign(log, s); refreshLog();
}
function resolveAt(pos){ commitLog(Math.min(pos, bucketItems().length)); }
function commitLog(pos){
  const others=bucketItems();
  others.splice(pos,0,log.k);
  const rebuilt=[];
  for(const b of ORDER){
    if(b===log.bucket) rebuilt.push(...others.map(k=>({k,b})));
    else rebuilt.push(...S.watched.filter(w=>w.b===b));
  }
  S.watched=rebuilt;
  if(S.queue.includes(log.k)){ S.queue=S.queue.filter(x=>x!==log.k); S.rankedFromImport++; }
  S.watchlist=S.watchlist.filter(x=>x!==log.k);
  log.stage="result"; save(); refreshLog();
}
function finishLog(){
  const e=myEntry(log.k);
  const name=MOVIES[log.k].t;
  log.stage="result"; log=null;
  closeOverlay(); S.subTab="watched"; save(); go("lists");
  toast(`${name} ranked #${e.rank} · ${e.score.toFixed(1)}`);
}

let chat=[];
function renderChat(){
  $("screen-chat").innerHTML=`
    <div class="pad" style="display:flex; align-items:center; padding-top:10px; flex:0 0 auto;">
      <button class="iconbtn" onclick="go('feed')">${I("chevL",22,2)}</button>

      <span style="width:30px;"></span>
    </div>
    <div style="flex:1; overflow-y:auto; padding:14px 0;" id="chatScroll">
      ${chat.length===0?`<div class="empty" style="padding-top:40px;"><span style="color:var(--teal);">${I("spark",34,1.5)}</span>
        <b>What should I watch tonight?</b>
        <span class="sub">Cini knows your rankings and watchlist.<br>Try a starter:</span></div>
      <div class="row-scroll" style="justify-content:center; flex-wrap:wrap;">
        ${["What should I watch tonight?","Something like my #1 but shorter","Date night pick from my watchlist"].map(q=>
          `<button class="pill ghost" style="font-size:12.5px;" onclick="askCini('${esc(q)}')">${q}</button>`).join("")}
      </div>`:""}
      ${chat.map(c=>`<div class="bubble ${c.u?"user":"bot"}">${c.t}</div>`).join("")}
      ${chat.length&&chat[chat.length-1].thinking?`<div class="bubble bot sub">thinking…</div>`:""}
    </div>
    <div class="chatbar" style="margin-bottom:86px;">
      <input id="chatInput" placeholder="Ask for a movie…" onkeydown="if(event.key==='Enter')askCini(this.value)">
      <button class="sendbtn" onclick="askCini($('chatInput').value)">↑</button>
    </div>`;
  const sc=$("chatScroll"); sc.scrollTop=sc.scrollHeight;
}
function askCini(q){
  q=(q||"").trim(); if(!q) return;
  buzz(); chat.push({u:1,t:q},{u:0,t:"",thinking:1}); renderChat();
  setTimeout(()=>{
    chat.pop();
    const wl=S.watchlist[0]?MOVIES[S.watchlist[0]]:null;
    const top=scoredWatched()[0]?MOVIES[scoredWatched()[0].k]:null;
    let a;
    const ql=q.toLowerCase();
    if(ql.includes("date")) a=`For date night I'd grab <b>Past Lives</b> (2023) — quiet, romantic, 1h 45m, on Paramount+. Bring tissues.`;
    else if(ql.includes("short")&&top) a=`You loved <b>${top.t}</b> — for the same wavelength in under two hours, try <b>The Zone of Interest</b> (1h 45m, on Max). Heavier, but unshakeable.`;
    else if(wl) a=`Easy: <b>${wl.t}</b> is sitting right on your watchlist — ${wl.rt}, streaming on ${wl.on[0]}. Your friends average it ${wl.avg.toFixed(1)}.`;
    else a=`Based on your top-ranked films, try <b>Poor Things</b> (2023) — bold, funny, gorgeous, on Hulu.`;
    chat.push({u:0,t:a}); renderChat();
  }, 900);
}
