<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Cini · Admin</title>
<link rel="icon" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Limelight&display=swap" rel="stylesheet" />
<style>
  :root{
    --marquee:#E8B64C; --velvet:#A8352A; --ink:#F5EEDF; --bg:#131011;
    --surface:#1D1719; --surface2:#262023; --gray:#A69C91;
    --hair:rgba(255,255,255,.12); --green:#2FBF71; --red:#e0455e; --blue:#7fa8d8;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wordmark{font-family:"Limelight",Georgia,serif; color:var(--marquee); font-size:26px; letter-spacing:0;}
  .serif{font-family:"DM Serif Display",Georgia,serif; font-weight:400;}
  a{color:var(--marquee);}
  /* ---- top bar ---- */
  header.bar{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px;
    padding:14px 22px; background:rgba(19,16,17,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair);}
  .tag{font-size:10px; letter-spacing:.35em; font-weight:800; color:var(--marquee);
    border:1px solid rgba(232,182,76,.4); border-radius:6px; padding:3px 7px;}
  .bar .spacer{flex:1;}
  .bar .asof{font-size:12px; color:var(--gray);}
  button.btn{font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink);
    background:var(--surface2); border:1px solid var(--hair); border-radius:10px; padding:8px 13px;}
  button.btn:hover{border-color:rgba(255,255,255,.28);}
  button.btn.primary{background:var(--velvet); border-color:transparent; color:#fff;}
  select.btn{font:inherit; font-size:13px; font-weight:700;}
  /* ---- layout ---- */
  main{max-width:1100px; margin:0 auto; padding:22px;}
  h2.section{font-size:13px; letter-spacing:.2em; font-weight:800; color:var(--gray);
    text-transform:uppercase; margin:30px 0 12px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
  .card{background:var(--surface); border:1px solid var(--hair); border-radius:16px; padding:16px 17px;}
  .kpi .label{font-size:12px; color:var(--gray); font-weight:600;}
  .kpi .num{font-size:30px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:12px; color:var(--gray); margin-top:4px;}
  .kpi .sub b{color:var(--green);}
  .charts{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .chart .ctitle{display:flex; justify-content:space-between; align-items:baseline;}
  .chart .ctitle b{font-size:14px;} .chart .ctitle span{font-size:12px; color:var(--gray);}
  .chart svg{width:100%; height:90px; margin-top:10px; display:block;}
  .seg{display:flex; height:14px; border-radius:99px; overflow:hidden; margin-top:6px;}
  .seg i{display:block; height:100%;}
  .legend{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--gray); flex-wrap:wrap;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  td,th{text-align:left; padding:9px 6px; border-bottom:1px solid var(--hair);}
  th{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray); font-weight:700;}
  td.n{text-align:right; font-variant-numeric:tabular-nums;}
  .pill{font-size:10px; font-weight:800; letter-spacing:.05em; padding:2px 7px; border-radius:99px;}
  .pill.movie{background:rgba(127,168,216,.16); color:var(--blue);}
  .pill.tv{background:rgba(232,182,76,.16); color:var(--marquee);}
  .muted{color:var(--gray);}
  /* ---- login ---- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px;}
  .login{width:100%; max-width:360px; text-align:center;}
  .login .wordmark{font-size:40px;}
  .login .tag{display:inline-block; margin:8px 0 22px;}
  .tabs{display:flex; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:16px;}
  .tabs button{flex:1; font:inherit; font-weight:700; font-size:13px; cursor:pointer; color:var(--gray);
    background:none; border:none; padding:9px; border-radius:9px;}
  .tabs button.active{background:var(--surface); color:var(--ink);}
  .field{width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--surface);
    border:1px solid var(--hair); border-radius:12px; padding:13px 14px; margin-bottom:10px; outline:none;}
  .field:focus{border-color:var(--marquee);}
  .login button.go{width:100%; font:inherit; font-size:15px; font-weight:800; cursor:pointer; color:#fff;
    background:var(--velvet); border:none; border-radius:12px; padding:13px; margin-top:4px;}
  .err{color:var(--red); font-size:13px; margin-top:12px; min-height:18px;}
  .hint{color:var(--gray); font-size:12px; margin-top:16px;}
  .hidden{display:none !important;}
  .center{text-align:center; color:var(--gray); padding:40px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login-wrap">
  <div class="login">
    <div class="wordmark">cini</div>
    <div class="tag">ADMIN</div>
    <div class="tabs">
      <button id="tabEmail" class="active" onclick="setTab('email')">Email</button>
      <button id="tabPhone" onclick="setTab('phone')">Phone</button>
    </div>

    <div id="emailForm">
      <input id="email" class="field" type="email" placeholder="Email" autocomplete="username" />
      <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="go" onclick="signInEmail()">Sign in</button>
    </div>

    <div id="phoneForm" class="hidden">
      <input id="phone" class="field" type="tel" placeholder="Phone (e.g. +15551234567)" autocomplete="tel" />
      <div id="otpRow" class="hidden">
        <input id="otp" class="field" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code" />
      </div>
      <button id="phoneBtn" class="go" onclick="phoneStep()">Send code</button>
    </div>

    <div id="loginErr" class="err"></div>
    <div class="hint">Founder access only. Sign in with your Cini account.</div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dash" class="hidden">
  <header class="bar">
    <span class="wordmark">cini</span><span class="tag">ADMIN</span>
    <span class="spacer"></span>
    <span id="asof" class="asof"></span>
    <select id="range" class="btn" onchange="loadTrends()">
      <option value="7">7d</option>
      <option value="30" selected>30d</option>
      <option value="90">90d</option>
    </select>
    <button class="btn" onclick="loadAll()">Refresh</button>
    <button class="btn" onclick="signOut()">Sign out</button>
  </header>

  <main>
    <h2 class="section">Overview</h2>
    <div id="kpis" class="grid"></div>

    <h2 class="section">Trends</h2>
    <div id="charts" class="charts"></div>

    <h2 class="section">Ratings breakdown</h2>
    <div class="card">
      <div class="seg" id="sentSeg"></div>
      <div class="legend" id="sentLegend"></div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px;" id="twoCol">
      <div>
        <h2 class="section">Most ranked</h2>
        <div class="card"><table id="topTitles"><tbody></tbody></table></div>
      </div>
      <div>
        <h2 class="section">Recent activity</h2>
        <div class="card"><table id="activity"><tbody></tbody></table></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Public, client-side config. The anon key is a PUBLISHABLE key (the iOS app
   ships it too); it is NOT a secret. Every admin_* RPC is SECURITY DEFINER and
   hard-gates on is_admin(), so only the founder's signed-in session reads data. */
const SUPABASE_URL = "https://npumchnkbcajyuhurgez.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdW1jaG5rYmNhanl1aHVyZ2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDgxMTAsImV4cCI6MjA5NjY4NDExMH0.DahwElvj1oqZRbQbnocmxVm8Yb1y2i61tuLBW8AV4h8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = (id) => document.getElementById(id);
const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString());

/* ---------- auth ---------- */
let authTab = "email";
function setTab(t){
  authTab = t;
  $("tabEmail").classList.toggle("active", t === "email");
  $("tabPhone").classList.toggle("active", t === "phone");
  $("emailForm").classList.toggle("hidden", t !== "email");
  $("phoneForm").classList.toggle("hidden", t !== "phone");
  $("loginErr").textContent = "";
}
function showErr(m){ $("loginErr").textContent = m || ""; }

async function signInEmail(){
  showErr("");
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password){ showErr("Enter your email and password."); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showErr(error.message); return; }
  enter();
}

let otpSent = false;
async function phoneStep(){
  showErr("");
  const phone = $("phone").value.trim();
  if(!phone.startsWith("+")){ showErr("Use full international format, e.g. +15551234567"); return; }
  if(!otpSent){
    const { error } = await sb.auth.signInWithOtp({ phone });
    if(error){ showErr(error.message); return; }
    otpSent = true;
    $("otpRow").classList.remove("hidden");
    $("phoneBtn").textContent = "Verify & sign in";
    return;
  }
  const token = $("otp").value.trim();
  const { error } = await sb.auth.verifyOtp({ phone, token, type: "sms" });
  if(error){ showErr(error.message); return; }
  enter();
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }

/* ---------- gate + boot ---------- */
async function enter(){
  // Confirm this account is actually the admin before showing the shell.
  const { data, error } = await sb.rpc("admin_overview");
  if(error){
    if((error.message || "").toLowerCase().includes("forbidden")){
      showErr("This account isn't an admin.");
      await sb.auth.signOut();
    } else {
      showErr(error.message);
    }
    return;
  }
  $("loginView").classList.add("hidden");
  $("dash").classList.remove("hidden");
  renderOverview(data);
  loadTrends();
  loadLists();
}

async function loadAll(){
  const { data } = await sb.rpc("admin_overview");
  if(data) renderOverview(data);
  loadTrends();
  loadLists();
}

/* ---------- render ---------- */
function kpi(label, num, sub){
  return `<div class="card kpi"><div class="label">${label}</div>
    <div class="num">${fmt(num)}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}
function renderOverview(d){
  $("asof").textContent = "as of " + new Date(d.generated_at).toLocaleString();
  $("kpis").innerHTML = [
    kpi("Total users", d.total_users, `<b>+${fmt(d.new_users_7d)}</b> this week`),
    kpi("Active (7d)", d.active_7d, "ranked or posted"),
    kpi("Titles ranked", d.total_rankings, `${fmt(d.movies_ranked)} films · ${fmt(d.tv_ranked)} TV`),
    kpi("Ranked this week", d.rankings_7d, `avg score ${d.avg_score ?? "—"}`),
    kpi("Bookmarks", d.total_bookmarks, `<b>+${fmt(d.bookmarks_7d)}</b> this week`),
    kpi("Passes (swipe left)", d.total_passes, `<b>+${fmt(d.passes_7d)}</b> this week`),
    kpi("Follows", d.total_follows, ""),
    kpi("Invites joined", d.total_invites, `<b>+${fmt(d.invites_7d)}</b> this week`),
    kpi("Catalog titles", d.catalog_titles, "cached from TMDB"),
  ].join("");

  const total = (d.loved || 0) + (d.fine || 0) + (d.disliked || 0);
  const pct = (n) => total ? (n / total * 100).toFixed(0) : 0;
  $("sentSeg").innerHTML = total ? `
    <i style="width:${pct(d.loved)}%; background:var(--green);"></i>
    <i style="width:${pct(d.fine)}%; background:var(--marquee);"></i>
    <i style="width:${pct(d.disliked)}%; background:var(--red);"></i>` :
    `<i style="width:100%; background:var(--surface2);"></i>`;
  $("sentLegend").innerHTML = `
    <span><i style="background:var(--green)"></i>Liked ${fmt(d.loved)} (${pct(d.loved)}%)</span>
    <span><i style="background:var(--marquee)"></i>Fine ${fmt(d.fine)} (${pct(d.fine)}%)</span>
    <span><i style="background:var(--red)"></i>Disliked ${fmt(d.disliked)} (${pct(d.disliked)}%)</span>`;
}

/* tiny SVG bar chart from [{date, <key>}] */
function barChart(series, key, color){
  const vals = series.map(p => +p[key] || 0);
  const max = Math.max(1, ...vals);
  const n = series.length, gap = n > 45 ? 0.5 : 1.5, w = 100 / n;
  const bars = series.map((p, i) => {
    const h = (+p[key] || 0) / max * 100;
    return `<rect x="${(i*w+gap/2).toFixed(2)}" y="${(100-h).toFixed(2)}" width="${(w-gap).toFixed(2)}" height="${h.toFixed(2)}" rx="0.6" fill="${color}"/>`;
  }).join("");
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${bars}</svg>`;
}
async function loadTrends(){
  const days = +$("range").value;
  const { data, error } = await sb.rpc("admin_trends", { p_days: days });
  if(error || !data){ return; }
  const sum = (k) => data.reduce((a, p) => a + (+p[k] || 0), 0);
  const defs = [
    ["Signups", "signups", "var(--marquee)"],
    ["Rankings", "rankings", "var(--green)"],
    ["Bookmarks", "bookmarks", "var(--blue)"],
    ["Passes", "passes", "var(--red)"],
  ];
  $("charts").innerHTML = defs.map(([label, key, color]) => `
    <div class="card chart">
      <div class="ctitle"><b>${label}</b><span>${fmt(sum(key))} in ${days}d</span></div>
      ${barChart(data, key, color)}
    </div>`).join("");
}

async function loadLists(){
  const [{ data: top }, { data: act }] = await Promise.all([
    sb.rpc("admin_top_titles", { p_limit: 10 }),
    sb.rpc("admin_recent_activity", { p_limit: 40 }),
  ]);
  $("topTitles").querySelector("tbody").innerHTML =
    `<tr><th>Title</th><th></th><th class="n">Ranks</th><th class="n">Avg</th></tr>` +
    (top || []).map(t => `<tr>
      <td>${esc(t.title || "—")}</td>
      <td><span class="pill ${t.tv ? "tv" : "movie"}">${t.tv ? "TV" : "FILM"}</span></td>
      <td class="n">${fmt(t.count)}</td><td class="n">${t.avg ?? "—"}</td></tr>`).join("");

  $("activity").querySelector("tbody").innerHTML =
    `<tr><th>Who</th><th>Did</th><th>Title</th><th class="n">When</th></tr>` +
    (act || []).map(a => `<tr>
      <td>@${esc(a.user || "—")}</td>
      <td class="muted">${esc(prettyKind(a.kind))}</td>
      <td>${esc(a.title || "—")}</td>
      <td class="n muted">${rel(a.at)}</td></tr>`).join("");
}
function prettyKind(k){
  return ({ranked:"ranked", watchlisted:"bookmarked", noted:"wrote about"})[k] || (k || "—");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rel(iso){
  if(!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  if(s < 60) return "now";
  if(s < 3600) return Math.floor(s/60) + "m";
  if(s < 86400) return Math.floor(s/3600) + "h";
  return Math.floor(s/86400) + "d";
}

/* resume an existing session on reload */
(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session) enter();
})();
</script>
</body>
</html>
