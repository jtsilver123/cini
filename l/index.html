<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131011">
<title>A list on Cini</title>
<meta property="og:title" content="A movie list on Cini">
<meta property="og:description" content="A ranked list of movies & shows on Cini — every film, ranked. No star ratings, just taste.">
<meta property="og:image" content="https://trycini.com/og.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Limelight&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{--marquee:#E8B64C;--velvet:#A8352A;--ink:#F5EEDF;--bg:#131011;--surface:#1D1719;--surface2:#262022;--gray:#A69C91;--hair:rgba(255,255,255,.12);}
  *{box-sizing:border-box;margin:0;}
  body{min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;background:radial-gradient(70% 40% at 50% 0%, rgba(232,182,76,.12), transparent 70%), var(--bg);}
  a{color:inherit;}
  .wrap{max-width:720px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .wordmark{font-family:"Limelight",Georgia,serif;font-size:30px;color:var(--marquee);line-height:1;text-decoration:none;}
  .getcini{text-decoration:none;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;background:var(--velvet);color:#fff;white-space:nowrap;}
  .listname{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:32px;line-height:1.15;}
  .by{color:var(--gray);font-size:15px;margin-top:8px;display:flex;align-items:center;gap:8px;}
  .by img{width:26px;height:26px;border-radius:50%;object-fit:cover;}
  .count{color:var(--gray);font-size:13px;margin-top:4px;}
  .divider{height:1px;background:var(--hair);margin:24px 0 18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 12px;}
  .card{text-decoration:none;color:inherit;}
  .poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--surface2) center/cover no-repeat;box-shadow:0 6px 16px rgba(0,0,0,.35);}
  .ptitle{font-size:12px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pyear{font-size:11px;color:var(--gray);}
  .msg{text-align:center;color:var(--gray);padding:48px 16px;font-size:16px;line-height:1.6;}
  .cta{display:block;text-decoration:none;font-weight:700;font-size:16px;padding:15px 24px;border-radius:999px;margin:12px auto;max-width:320px;text-align:center;}
  .primary{background:var(--velvet);color:#fff;box-shadow:0 10px 26px rgba(168,53,42,.32);}
  .ghost{background:none;border:1px solid var(--hair);color:var(--ink);}
  .foot{margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="/">cini</a>
    <a class="getcini" href="https://apps.apple.com/us/app/cini-rank-every-film/id6778975898">Get Cini</a>
  </div>
  <div id="content"><div class="msg">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://npumchnkbcajyuhurgez.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdW1jaG5rYmNhanl1aHVyZ2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDgxMTAsImV4cCI6MjA5NjY4NDExMH0.DahwElvj1oqZRbQbnocmxVm8Yb1y2i61tuLBW8AV4h8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const APP_STORE = "https://apps.apple.com/us/app/cini-rank-every-film/id6778975898";

const $ = (id) => document.getElementById(id);
const listId = (new URLSearchParams(location.search).get('id') || '').replace(/[^a-f0-9-]/gi, '').slice(0, 40);

function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function poster(path){ return path ? `url("https://image.tmdb.org/t/p/w342${String(path).replace(/[^A-Za-z0-9/_.\-]/g,'')}")` : "none"; }
function safeUrl(u){ return (typeof u==="string" && /^https:\/\//i.test(u)) ? u : null; }

// Fallback landing (private/unavailable list, or no id) — still offer the app.
function landing(headline, sub){
  const c=$("content"); c.innerHTML="";
  c.appendChild(el("div","msg")).append(headline);
  const m=el("div","msg",sub||""); c.appendChild(m);
  const open=el("a","cta primary","Open in Cini"); open.href = listId ? ("cini://list?id="+encodeURIComponent(listId)) : "cini://"; c.appendChild(open);
  const get=el("a","cta ghost","Get Cini on the App Store"); get.href=APP_STORE; c.appendChild(get);
}

async function load(){
  if(!listId){ landing("Someone shared a list with you","Open it in Cini to see every title, perfectly ordered."); return; }
  const { data: list } = await sb.rpc("public_list", { p_list_id: listId });
  if(!list){ landing("This list isn’t available","It may be private, or the link may be off — open Cini to check."); return; }

  document.title = (list.name || "A list") + " · Cini";
  const c=$("content"); c.innerHTML="";
  c.appendChild(el("div","listname", list.name || "Untitled list"));
  const by=el("div","by");
  const o=list.owner||{}; const avurl=safeUrl(o.avatar_url);
  if(avurl){ const img=el("img"); img.src=avurl; img.alt=""; by.appendChild(img); }
  by.appendChild(el("span",null,"by "+(o.display_name || ("@"+(o.username||"someone")))));
  c.appendChild(by);
  const items = Array.isArray(list.items) ? list.items : [];
  c.appendChild(el("div","count", items.length + (items.length===1?" title":" titles")));
  c.appendChild(el("div","divider"));

  if(!items.length){ c.appendChild(el("div","msg","This list is empty.")); }
  else {
    const grid=el("div","grid");
    for(const m of items){
      const card=el("a","card"); card.href=APP_STORE;
      const p=el("div","poster"); p.style.backgroundImage=poster(m.poster_path); card.appendChild(p);
      card.appendChild(el("div","ptitle", m.title||""));
      if(m.release_year) card.appendChild(el("div","pyear", String(m.release_year)));
      grid.appendChild(card);
    }
    c.appendChild(grid);
  }

  const foot=el("div","foot");
  const open=el("a","cta primary","Open this list in Cini"); open.href="cini://list?id="+encodeURIComponent(listId); foot.appendChild(open);
  const get=el("a","cta ghost","Get Cini on the App Store"); get.href=APP_STORE; foot.appendChild(get);
  c.appendChild(foot);
}
load().catch(function(){ landing("Couldn’t load this list","Open Cini to see it."); });
</script>
</body>
</html>
