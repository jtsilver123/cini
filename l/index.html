<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131011">
<title>A list on Cini</title>
<meta property="og:title" content="A movie list on Cini">
<meta property="og:description" content="A ranked list of movies & shows on Cini — every film, ranked. No star ratings, just taste.">
<meta property="og:image" content="https://trycini.com/og.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Limelight&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--marquee:#E8B64C;--velvet:#A8352A;--ink:#F5EEDF;--bg:#131011;--surface:#1D1719;--gray:#A69C91;--hair:rgba(255,255,255,.12);}
  *{box-sizing:border-box;margin:0;}
  body{min-height:100vh;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(60% 40% at 50% 0%, rgba(232,182,76,.14), transparent 70%), #131011;}
  .card{max-width:440px;width:100%;}
  .wordmark{font-family:"Limelight",Georgia,serif;font-size:56px;color:var(--marquee);line-height:1;}
  .tagline{font-size:11px;letter-spacing:.4em;color:var(--gray);font-weight:700;margin-top:8px;}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:28px;margin:34px 0 10px;line-height:1.2;}
  p.lede{color:var(--gray);font-size:16px;line-height:1.6;margin:0 auto 30px;max-width:360px;}
  .cta{display:block;text-decoration:none;font-weight:700;font-size:16px;padding:15px 24px;border-radius:999px;margin:12px auto;max-width:320px;}
  .primary{background:var(--velvet);color:#fff;box-shadow:0 10px 26px rgba(168,53,42,.35);}
  .ghost{background:none;border:1px solid var(--hair);color:var(--ink);}
  .note{font-size:12.5px;color:var(--gray);margin-top:22px;}
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">cini</div>
  <div class="tagline">EVERYTHING YOU WATCH · RANKED</div>
  <h1>Someone shared a list with you</h1>
  <p class="lede">Open it in Cini to see every title ranked — no star ratings, just taste, perfectly ordered.</p>
  <a class="cta primary" id="openBtn" href="#">Open in Cini</a>
  <a class="cta ghost" href="https://apps.apple.com/us/app/cini-rank-every-film/id6778975898">Get Cini on the App Store</a>
  <p class="note">Already have the app? Tap “Open in Cini.” New here? Tap “Get Cini,” then open the link again.</p>
</div>
<script>
  // textContent/href only — the id rides in from the URL, sanitized.
  var id = (new URLSearchParams(location.search).get('id') || '').replace(/[^a-f0-9-]/gi, '').slice(0, 40);
  document.getElementById('openBtn').href = id ? 'cini://list?id=' + encodeURIComponent(id) : 'cini://';
</script>
</body>
</html>
